        function renderDirectory(saasFilter = 'all') {
            const container = document.getElementById('saas-groups-container');
            const filteredGroups = saasFilter === 'all' 
                ? SAAS_DIRECTORY 
                : SAAS_DIRECTORY.filter(s => s.id === saasFilter);

            container.innerHTML = filteredGroups.map(group => `
                <div class="p-6 md:p-8 rounded-3xl bg-[#0b0b0f] border ${group.themeColor.split(' ')[0]} shadow-2xl space-y-6">
                    <!-- INTESTAZIONE DEL GRUPPO SAAS -->
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-zinc-900 pb-4">
                        <div class="flex items-center gap-3.5">
                            <span class="text-3xl">${group.icon}</span>
                            <div>
                                <h2 class="text-xl md:text-2xl font-black text-white font-display">${group.name}</h2>
                                <p class="text-xs md:text-sm text-gray-400 font-medium">${group.tagline}</p>
                            </div>
                        </div>
                        <span class="text-xs font-bold px-3.5 py-1.5 rounded-full border ${group.badgeBg} font-mono">
                            ${group.products.length} Pacchetti Attivi
                        </span>
                    </div>

                    <!-- GRIGLIA PRODOTTI DEL SINGOLO SAAS -->
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${group.products.map(prod => `
                            <div class="p-5 rounded-2xl bg-[#12121a] border border-zinc-800/80 hover:border-purple-500/50 transition-all flex flex-col justify-between space-y-4 shadow-lg">
                                <div>
                                    <div class="flex justify-between items-start gap-2 mb-1.5">
                                        <span class="text-[10px] uppercase font-black px-2.5 py-0.5 rounded-md bg-zinc-900 text-gray-300 border border-zinc-800 font-mono">
                                            ${prod.type}
                                        </span>
                                        <span class="text-base font-black text-amber-400 font-mono">${prod.price}</span>
                                    </div>
                                    <h3 class="text-sm font-bold text-white font-serif">${prod.name}</h3>
                                    <p class="text-xs text-gray-400 mt-1 leading-relaxed">${prod.desc}</p>
                                </div>

                                <div class="pt-3 border-t border-zinc-900 flex gap-2">
                                    <button onclick="copyToClipboard('${prod.url}')" class="flex-1 py-2.5 px-3 rounded-xl bg-zinc-900 hover:bg-zinc-800 text-gray-200 border border-zinc-800 text-xs font-bold flex items-center justify-center gap-1.5 transition active:scale-95">
                                        <i class="fa-solid fa-copy text-purple-400"></i> Copia
                                    </button>
                                    <a href="https://wa.me/?text=${encodeURIComponent('Salve! Ecco il link sicuro di pagamento Stripe per ' + group.name + ' - ' + prod.name + ' (' + prod.price + '):\n' + prod.url)}" target="_blank" class="py-2.5 px-3.5 rounded-xl bg-emerald-600/20 hover:bg-emerald-600/40 text-emerald-300 border border-emerald-500/30 text-xs font-bold transition flex items-center justify-center" title="Invia su WhatsApp">
                                        <i class="fa-brands fa-whatsapp text-sm"></i>
                                    </a>
                                    <a href="${prod.url}" target="_blank" class="py-2.5 px-3.5 rounded-xl bg-purple-600 hover:bg-purple-500 text-white text-xs font-bold transition flex items-center justify-center" title="Apri Checkout">
                                        <i class="fa-solid fa-arrow-up-right-from-square"></i>
                                    </a>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function filterBySaas(saasId) {
            document.querySelectorAll('.saas-filter-btn').forEach(b => {
                b.classList.remove('bg-purple-600', 'text-white');
                b.classList.add('bg-zinc-900', 'text-gray-300');
            });
            event.target.classList.remove('bg-zinc-900', 'text-gray-300');
            event.target.classList.add('bg-purple-600', 'text-white');

            renderDirectory(saasId);
        }

        function copyToClipboard(url) {
            navigator.clipboard.writeText(url);
            const toast = document.getElementById('toast');
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 2500);
        }

        renderDirectory('all');
    </script>

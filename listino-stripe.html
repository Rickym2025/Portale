        function renderCards(list) {
            const container = document.getElementById('links-container');
            container.innerHTML = list.map(item => `
                <div class="p-5 rounded-2xl bg-[#0b0b0f] border border-zinc-900 hover:border-purple-500/40 transition-all flex flex-col justify-between space-y-4 shadow-xl">
                    <div>
                        <div class="flex justify-between items-start gap-2 mb-2">
                            <span class="text-xs font-bold px-2.5 py-1 rounded-lg bg-zinc-900 text-gray-300 border border-zinc-800 font-mono flex items-center gap-1.5">
                                <span>${item.icon}</span> ${item.saas.toUpperCase()}
                            </span>
                            <span class="text-sm font-black text-amber-400 font-mono">${item.price} <span class="text-[10px] text-gray-400 font-normal font-sans">${item.type}</span></span>
                        </div>
                        <h3 class="text-base font-bold text-white font-serif">${item.name}</h3>
                        <p class="text-xs text-gray-400 mt-1 leading-relaxed">${item.desc}</p>
                    </div>

                    <div class="pt-3 border-t border-zinc-900 flex gap-2">
                        <button onclick="copyToClipboard('${item.url}')" class="flex-1 py-2.5 px-3 rounded-xl bg-zinc-900 hover:bg-zinc-800 text-gray-200 border border-zinc-800 text-xs font-bold flex items-center justify-center gap-1.5 transition active:scale-95">
                            <i class="fa-solid fa-copy text-purple-400"></i> Copia Link
                        </button>
                        <a href="https://wa.me/?text=${encodeURIComponent('Salve! Ecco il link sicuro di pagamento Stripe per ' + item.name + ' (' + item.price + '):\n' + item.url)}" target="_blank" class="py-2.5 px-3.5 rounded-xl bg-emerald-600/20 hover:bg-emerald-600/40 text-emerald-300 border border-emerald-500/30 text-xs font-bold transition flex items-center justify-center">
                            <i class="fa-brands fa-whatsapp text-sm"></i>
                        </a>
                        <a href="${item.url}" target="_blank" class="py-2.5 px-3.5 rounded-xl bg-purple-600 hover:bg-purple-500 text-white text-xs font-bold transition flex items-center justify-center">
                            <i class="fa-solid fa-arrow-up-right-from-square"></i>
                        </a>
                    </div>
                </div>
            `).join('');
        }

        function filterLinks() {
            const search = document.getElementById('search-input').value.toLowerCase().trim();
            const saas = document.getElementById('filter-saas').value;

            const filtered = STRIPE_PRODUCTS.filter(p => {
                const matchSearch = p.name.toLowerCase().includes(search) || p.desc.toLowerCase().includes(search) || p.saas.toLowerCase().includes(search);
                const matchSaas = (saas === 'all') || (p.saas.toLowerCase() === saas.toLowerCase());
                return matchSearch && matchSaas;
            });

            renderCards(filtered);
        }

        function copyToClipboard(url) {
            navigator.clipboard.writeText(url);
            const toast = document.getElementById('toast');
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 2500);
        }

        renderCards(STRIPE_PRODUCTS);
    </script>
</body>
</html>

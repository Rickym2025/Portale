<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RM Studio — Mobile Sales Launcher</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050508;
            color: #f3f4f6;
            font-size: 14px;
            -webkit-tap-highlight-color: transparent;
        }
        .font-display { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        .saas-card {
            min-height: 100px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .saas-card:active {
            transform: scale(0.96);
        }
        .saas-card.selected {
            border-color: #a855f7 !important;
            background: #131024 !important;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
        }
        .saas-card.is-primary {
            border-color: #10b981 !important;
            background: #091712 !important;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
        }
        .saas-card.is-upsell {
            border-color: #f59e0b !important;
            background: #17120a !important;
        }
        .saas-card.dimmed {
            opacity: 0.35;
            filter: grayscale(80%);
        }

        .bundle-chip {
            transition: all 0.15s ease;
        }
        .bundle-chip.active {
            background-color: #9333ea;
            color: #ffffff;
            border-color: #c084fc;
        }
    </style>
</head>
<body class="p-3.5 pb-52 min-h-screen flex flex-col justify-between selection:bg-purple-600 selection:text-white">

    <!-- HEADER MOBILE -->
    <header class="flex items-center justify-between pb-3.5 border-b border-zinc-900 mb-3">
        <div class="flex items-center gap-2.5">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-purple-600 via-pink-600 to-amber-500 flex items-center justify-center shadow-lg shadow-purple-600/30 shrink-0">
                <i class="fa-solid fa-bolt text-lg text-white"></i>
            </div>
            <div>
                <h1 class="font-display font-black text-white text-base leading-tight">Mobile Sales Launcher</h1>
                <span class="text-[11px] text-purple-400 font-bold">RM Studio • Presentazione &amp; Invio Demo</span>
            </div>
        </div>
        <div class="flex items-center gap-1.5">
            <a href="listino-stripe.html" class="w-9 h-9 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-300 flex items-center justify-center text-xs font-bold active:scale-95" title="Listino Prezzi">
                <i class="fa-solid fa-tags"></i>
            </a>
            <a href="index.html" class="w-9 h-9 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-300 flex items-center justify-center text-xs font-bold active:scale-95" title="Master Desktop">
                <i class="fa-solid fa-desktop"></i>
            </a>
        </div>
    </header>

    <main class="flex-1 space-y-3.5">
        
        <!-- SELETTORE SETTORE DI ATTIVITÀ -->
        <div class="bg-[#0b0b12] border border-zinc-800 p-3.5 rounded-2xl space-y-2 shadow-xl">
            <label class="block text-xs font-black uppercase tracking-wider text-purple-300 flex items-center justify-between">
                <span>🎯 Settore di Attività del Lead</span>
                <span id="sector-count-badge" class="text-[10px] font-mono text-zinc-400">21 Prodotti</span>
            </label>
            <select id="sector-advisor" onchange="applySectorFilter()" class="w-full bg-[#13141f] border border-purple-500/40 focus:border-purple-400 rounded-xl p-3 text-xs text-white font-bold outline-none cursor-pointer">
                <option value="all">-- Tutti i 21 SaaS (Nessun Filtro) --</option>
                <option value="auto" selected>🏎️ Concessionarie Auto &amp; Saloni Usato</option>
                <option value="ristorazione">🍽️ Ristoranti, Pizzerie, Bistrot &amp; Wine Bar</option>
                <option value="architettura">🏛️ Architetti, Interior Designer &amp; Geometri</option>
                <option value="immobiliare">🏠 Agenzie Immobiliari &amp; Costruttori</option>
                <option value="medico">🦷 Studi Medici, Odontoiatri &amp; Cliniche</option>
                <option value="legale">⚖️ Studi Legali, Avvocati &amp; Commercialisti</option>
                <option value="hotel">🏨 Hotel, B&amp;B &amp; Strutture Turistiche</option>
                <option value="funebre">🕊️ Onoranze Funebri &amp; Pet Memorials</option>
                <option value="wedding">💍 Wedding Planner &amp; Eventi</option>
                <option value="palestra">🏋️ Palestre, Centri Fitness &amp; Personal Trainer</option>
                <option value="ecommerce">📦 E-Commerce, Retail &amp; Brand</option>
                <option value="fotovoltaico">☀️ Installatori Fotovoltaico &amp; Energie</option>
                <option value="ebike">⚡ Officine &amp; Rivenditori E-Bike (Bosch)</option>
                <option value="cantieri">🦺 Cantieri Edili &amp; Lavoratori Isolati</option>
                <option value="vigilanza">🛡️ Istituti di Vigilanza &amp; Ronde Notturne</option>
                <option value="outdoor">📡 Caravan, Moto Pack &amp; Gruppi Outdoor</option>
                <option value="pmi">🏢 PMI, Liberi Professionisti &amp; Landing</option>
            </select>
        </div>

        <!-- GRIGLIA UNIFORME DINAMICA DEI 21 SAAS -->
        <div class="grid grid-cols-2 gap-2.5" id="saas-grid">
            <!-- Popolato e riordinato dinamicamente via JS -->
        </div>

    </main>

    <!-- CASSETTO STICKY IN BASSO: INVIO TEST DAL VIVO & STRIPE DEAL -->
    <div class="fixed bottom-0 left-0 right-0 bg-[#08090f]/98 border-t border-purple-500/40 backdrop-blur-2xl p-3 z-40 shadow-2xl">
        <div class="max-w-md mx-auto space-y-2.5">
            
            <!-- Riga 1: Commutatore Tab (Invia Demo vs Chiudi Offerta) -->
            <div class="flex items-center justify-between gap-2 border-b border-zinc-800 pb-2">
                <div class="flex items-center gap-1.5 bg-[#12131d] p-1 rounded-xl border border-zinc-800">
                    <button type="button" id="tab-btn-demo" onclick="switchLauncherTab('demo')" class="px-3 py-1 rounded-lg text-xs font-bold bg-purple-600 text-white transition cursor-pointer">
                        🚀 Invia Demo al Lead
                    </button>
                    <button type="button" id="tab-btn-deal" onclick="switchLauncherTab('deal')" class="px-3 py-1 rounded-lg text-xs font-bold text-zinc-400 hover:text-white transition cursor-pointer">
                        💳 Sblocco Stripe
                    </button>
                </div>

                <div class="flex items-center gap-1">
                    <button type="button" onclick="openQrModal()" class="w-8 h-8 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-white flex items-center justify-center text-xs active:scale-95 cursor-pointer" title="Inquadra QR Code subito dal vivo">
                        <i class="fa-solid fa-qrcode text-sm text-cyan-400"></i>
                    </button>
                    <button type="button" onclick="copyCurrentLinks()" class="w-8 h-8 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-white flex items-center justify-center text-xs active:scale-95 cursor-pointer" title="Copia link">
                        <i class="fa-solid fa-copy text-sm"></i>
                    </button>
                    <a id="bar-open-btn" href="#" target="_blank" class="w-8 h-8 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-purple-300 flex items-center justify-center text-xs active:scale-95" title="Apri demo">
                        <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                    </a>
                </div>
            </div>

            <!-- Riga 2: Dati del Prospect (Nome, Cellulare, Email) -->
            <div class="space-y-1.5">
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="deal-lead-name" placeholder="Nome Lead o Azienda" class="w-full bg-[#12131d] border border-zinc-800 focus:border-purple-400 rounded-xl px-3 py-1.5 text-xs text-white outline-none">
                    <input type="tel" id="deal-lead-phone" placeholder="Cell. WhatsApp (es: 340...)" class="w-full bg-[#12131d] border border-zinc-800 focus:border-purple-400 rounded-xl px-3 py-1.5 text-xs text-white outline-none font-mono">
                </div>
                <input type="email" id="deal-lead-email" placeholder="Email del titolare (opzionale per invio Resend)" class="w-full bg-[#12131d] border border-zinc-800 focus:border-purple-400 rounded-xl px-3 py-1.5 text-xs text-white outline-none">
            </div>

            <!-- CONTENUTO TAB 1: INVIO DEMO & MULTI-LINK AL CLIENTE -->
            <div id="panel-tab-demo" class="space-y-2">
                <!-- Chip di Selezione Multi-Link da Includere -->
                <div class="flex items-center gap-1.5 overflow-x-auto pb-0.5 no-scrollbar" id="bundle-chips-container">
                    <!-- Popolato dinamicamente in base al settore -->
                </div>

                <!-- Pulsanti Azione Invio -->
                <div class="flex items-center gap-2 pt-0.5">
                    <button type="button" onclick="sendDemoWhatsApp()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs py-2.5 rounded-xl uppercase tracking-wider transition-all shadow-lg flex items-center justify-center gap-2 active:scale-95 cursor-pointer">
                        <i class="fa-brands fa-whatsapp text-base"></i>
                        <span>Invia su WhatsApp</span>
                    </button>
                    <button type="button" onclick="sendDemoEmail()" class="flex-1 bg-gradient-to-r from-blue-600 to-indigo-600 hover:brightness-110 text-white font-extrabold text-xs py-2.5 rounded-xl uppercase tracking-wider transition-all shadow-lg flex items-center justify-center gap-2 active:scale-95 cursor-pointer">
                        <i class="fa-solid fa-paper-plane text-xs"></i>
                        <span>Invia per Email</span>
                    </button>
                </div>
            </div>

            <!-- CONTENUTO TAB 2: CHIUSURA TRATTATIVA STRIPE -->
            <div id="panel-tab-deal" class="hidden space-y-2">
                <div class="flex items-center justify-between gap-3 bg-[#12131d] border border-purple-500/30 rounded-xl p-2">
                    <span class="text-xs text-zinc-300 font-bold truncate" id="deal-selected-saas-name">Prodotto</span>
                    <div class="flex items-center gap-1">
                        <span class="text-[10px] text-zinc-400 font-mono">Prezzo Offerta: €</span>
                        <input type="number" id="special-price-input" class="w-16 bg-transparent text-emerald-400 font-mono font-black text-sm text-center outline-none" value="169">
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <button type="button" id="btn-stripe-deal" onclick="generateSpecialStripeLink()" class="flex-1 bg-gradient-to-r from-purple-600 via-indigo-600 to-pink-600 hover:brightness-110 text-white font-extrabold text-xs py-2.5 rounded-xl uppercase tracking-wider transition-all shadow-lg flex items-center justify-center gap-1.5 active:scale-95 cursor-pointer">
                        <i class="fa-brands fa-stripe text-sm"></i>
                        <span>Genera Link Pagamento</span>
                    </button>
                    <button type="button" onclick="sendWhatsAppSpecialDeal()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs py-2.5 rounded-xl uppercase tracking-wider transition-all shadow-lg flex items-center justify-center gap-1.5 active:scale-95 cursor-pointer">
                        <i class="fa-brands fa-whatsapp text-sm"></i>
                        <span>Invia Tariffa Accordata</span>
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- MODALE POPUP QR CODE IN-PERSON CLOSER -->
    <div id="qr-modal" class="hidden fixed inset-0 z-50 bg-black/85 backdrop-blur-md p-4 flex items-center justify-center">
        <div class="bg-[#0e1017] border border-zinc-800 rounded-3xl max-w-xs w-full p-6 text-center space-y-4 shadow-2xl relative">
            <button type="button" onclick="closeQrModal()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white flex items-center justify-center cursor-pointer">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>
            <div class="w-12 h-12 rounded-2xl bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 flex items-center justify-center mx-auto text-xl">
                <i class="fa-solid fa-qrcode"></i>
            </div>
            <div>
                <h3 class="text-base font-black text-white" id="qr-modal-title">Inquadra con la Fotocamera</h3>
                <p class="text-[11px] text-zinc-400 mt-0.5">Fai inquadrare lo schermo al cliente per aprire istantaneamente la demo sul suo telefono.</p>
            </div>
            <div class="bg-white p-3 rounded-2xl inline-block shadow-inner">
                <img id="qr-code-img" src="" alt="QR Code" class="w-52 h-52 object-contain mx-auto">
            </div>
            <p class="text-[10px] font-mono text-purple-300 truncate" id="qr-modal-url"></p>
        </div>
    </div>

    <!-- TOAST NOTIFICA COPIA -->
    <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 bg-purple-600 text-white text-xs font-black px-4 py-2 rounded-full shadow-2xl z-50 hidden transition-all">
        Link copiato negli appunti!
    </div>

    <script>
        // 📚 I 21 SAAS ATTIVI DI RM STUDIO
        const SAAS_CATALOG = {
            radar: { id: "radar", name: "DriveMotion RADAR", emoji: "🏎️", defaultPrice: 179, url: "https://drivemotion-radar.rmstudio.app", tag: "Sourcing Privati h24", cat: "Auto" },
            drivemotion: { id: "drivemotion", name: "DriveMotion Video", emoji: "🚗", defaultPrice: 59, url: "https://drivemotion.rmstudio.app", tag: "Video Auto Sfondo AI", cat: "Auto" },
            locanda: { id: "locanda", name: "Locanda Digitale", emoji: "🍽️", defaultPrice: 169, url: "https://locandadigitale.rmstudio.app", tag: "Living 3D & Compleanni", cat: "Horeca" },
            experience: { id: "experience", name: "Smart Experience", emoji: "🍷", defaultPrice: 390, url: "https://experience.rmstudio.app", tag: "E-Menu con Maître AI", cat: "Horeca" },
            forma_materia: { id: "forma_materia", name: "Forma & Materia", emoji: "🏛️", defaultPrice: 249, url: "https://formamateria.rmstudio.app", tag: "Schizzo to Render 4K", cat: "Architettura" },
            sitengine: { id: "sitengine", name: "SiteEngine Pro", emoji: "🌐", defaultPrice: 400, url: "https://sitengine.rmstudio.app", tag: "Landing & Blog Smart", cat: "Web B2B" },
            dentis: { id: "dentis", name: "Dentis AI", emoji: "🦷", defaultPrice: 149, url: "https://dentis.rmstudio.app", tag: "Receptionist Dentisti", cat: "Sanità" },
            lexis: { id: "lexis", name: "Lexis AI", emoji: "⚖️", defaultPrice: 149, url: "https://lexis.rmstudio.app", tag: "Segreteria Legale H24", cat: "Legale" },
            concierge: { id: "concierge", name: "Concierge24", emoji: "🏨", defaultPrice: 179, url: "https://concierge24.rmstudio.app", tag: "Voce H24 Hotel & B&B", cat: "Turismo" },
            hometour: { id: "hometour", name: "HomeTour", emoji: "🏠", defaultPrice: 59, url: "https://hometour.rmstudio.app", tag: "Reel Immobiliari 3D", cat: "Immobiliare" },
            vision: { id: "vision", name: "Vision UGC", emoji: "🎬", defaultPrice: 120, url: "https://vision.rmstudio.app", tag: "Influencer Virtuali AI", cat: "Video Marketing" },
            nexus: { id: "nexus", name: "NexusAI", emoji: "🤖", defaultPrice: 99, url: "https://nexus.rmstudio.app", tag: "Sales Overlay Chatbot", cat: "Lead Gen" },
            eternia: { id: "eternia", name: "ETERNIA", emoji: "🕊️", defaultPrice: 199, url: "https://eternia.rmstudio.app", tag: "Memoriali QR & Pet", cat: "Memorial" },
            love: { id: "love", name: "LOVE", emoji: "💍", defaultPrice: 249, url: "https://love.rmstudio.app", tag: "Partecipazioni 3D Nozze", cat: "Wedding" },
            ares: { id: "ares", name: "AresAI", emoji: "🏋️", defaultPrice: 99, url: "https://ares.rmstudio.app", tag: "Voice Trainer & Dieta AI", cat: "Fitness" },
            social: { id: "social", name: "SocialEngine", emoji: "📊", defaultPrice: 79, url: "https://social.rmstudio.app", tag: "Carousel Creator AI", cat: "Social" },
            omniastudio: { id: "omniastudio", name: "OmniaStudio", emoji: "💼", defaultPrice: 699, url: "https://omniastudio.rmstudio.app", tag: "IA Offline Privata 100%", cat: "Fisco/Legal" },
            free_energy: { id: "free_energy", name: "Free Energy", emoji: "☀️", defaultPrice: 199, url: "https://free-energy.rmstudio.app", tag: "CAD Fotovoltaico & CRM", cat: "Solar" },
            velomotion: { id: "velomotion", name: "VeloMotion", emoji: "⚡", defaultPrice: 290, url: "https://velomotion.rmstudio.app", tag: "Sblocco Bosch BES3", cat: "E-Bike" },
            aura: { id: "aura", name: "AURA Proximity", emoji: "📡", defaultPrice: 19, url: "https://aura.rmstudio.app", tag: "Radar Mesh & Man-Down", cat: "Sicurezza" },
            ff_edizioni: { id: "ff_edizioni", name: "FF Edizioni", emoji: "🎵", defaultPrice: 300, url: "https://ff-edizioni.rmstudio.app", tag: "Jingle & Canzoni SIAE", cat: "Musica" }
        };

        // 🎯 MATRICE DI RACCOMANDAZIONE PER SETTORE (PRIMARI + UPSELL)
        const SECTOR_RECOMMENDATIONS = {
            auto: {
                primary: ['radar', 'drivemotion'],
                upsell: ['nexus', 'social']
            },
            ristorazione: {
                primary: ['locanda', 'experience'],
                upsell: ['nexus', 'ff_edizioni', 'social']
            },
            architettura: {
                primary: ['forma_materia', 'sitengine'],
                upsell: ['social', 'hometour']
            },
            immobiliare: {
                primary: ['hometour', 'forma_materia'],
                upsell: ['sitengine', 'social']
            },
            medico: {
                primary: ['dentis', 'sitengine'],
                upsell: ['nexus']
            },
            legale: {
                primary: ['lexis', 'omniastudio'],
                upsell: ['sitengine', 'nexus']
            },
            hotel: {
                primary: ['concierge', 'aura'],
                upsell: ['nexus', 'social']
            },
            funebre: {
                primary: ['eternia', 'ff_edizioni'],
                upsell: ['nexus']
            },
            wedding: {
                primary: ['love', 'ff_edizioni'],
                upsell: ['vision']
            },
            palestra: {
                primary: ['ares', 'vision'],
                upsell: ['social', 'aura']
            },
            ecommerce: {
                primary: ['vision', 'nexus'],
                upsell: ['social', 'ff_edizioni']
            },
            fotovoltaico: {
                primary: ['free_energy', 'nexus'],
                upsell: ['dentis']
            },
            ebike: {
                primary: ['velomotion', 'nexus'],
                upsell: ['social']
            },
            cantieri: {
                primary: ['aura', 'forma_materia'],
                upsell: ['free_energy']
            },
            vigilanza: {
                primary: ['aura', 'omniastudio'],
                upsell: ['sitengine', 'nexus']
            },
            outdoor: {
                primary: ['aura', 'ares'],
                upsell: ['drivemotion']
            },
            pmi: {
                primary: ['sitengine', 'nexus'],
                upsell: ['omniastudio', 'social']
            }
        };

        let currentActiveKey = "radar";
        let activeBundleKeys = new Set(["radar", "drivemotion"]);

        // RENDER DELLA GRIGLIA
        function renderGrid(orderedKeys = Object.keys(SAAS_CATALOG), primarySet = new Set(), upsellSet = new Set(), hasSectorFilter = false) {
            const container = document.getElementById('saas-grid');
            container.innerHTML = "";

            orderedKeys.forEach(key => {
                const item = SAAS_CATALOG[key];
                if (!item) return;

                const isPrimary = primarySet.has(key);
                const isUpsell = upsellSet.has(key);
                const isDimmed = hasSectorFilter && !isPrimary && !isUpsell;

                let badgeHtml = `<span class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-zinc-800 text-zinc-300">${item.cat}</span>`;
                if (isPrimary) {
                    badgeHtml = `<span class="text-[9px] font-black px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/40">★ Primario</span>`;
                } else if (isUpsell) {
                    badgeHtml = `<span class="text-[9px] font-black px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/40">+ Up-sell</span>`;
                }

                const card = document.createElement('button');
                card.type = 'button';
                card.id = `card-${key}`;
                card.onclick = () => selectSaas(key);
                card.className = `saas-card p-3 bg-[#0c0c12] border border-zinc-800/90 rounded-2xl text-left flex flex-col justify-between cursor-pointer ${
                    key === currentActiveKey ? 'selected' : ''
                } ${isPrimary ? 'is-primary' : ''} ${isUpsell ? 'is-upsell' : ''} ${isDimmed ? 'dimmed' : ''}`;

                card.innerHTML = `
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-2xl">${item.emoji}</span>
                        ${badgeHtml}
                    </div>
                    <div>
                        <div class="flex items-baseline justify-between gap-1">
                            <span class="font-display font-extrabold text-white text-xs block truncate">${item.name}</span>
                            <span class="text-[10px] font-mono text-purple-400 font-bold shrink-0">€${item.defaultPrice}</span>
                        </div>
                        <span class="text-[10px] text-zinc-400 font-medium leading-tight block truncate mt-0.5">${item.tag}</span>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        // AGGIORNAMENTO SELEZIONE SAAS
        function selectSaas(key) {
            currentActiveKey = key;
            const item = SAAS_CATALOG[key];
            if (!item) return;

            document.querySelectorAll('.saas-card').forEach(c => c.classList.remove('selected'));
            const card = document.getElementById(`card-${key}`);
            if (card) card.classList.add('selected');

            document.getElementById('bar-open-btn').href = item.url;
            document.getElementById('deal-selected-saas-name').innerText = `${item.emoji} ${item.name}`;

            const priceInput = document.getElementById('special-price-input');
            priceInput.value = item.defaultPrice;

            // Se non è nel bundle, lo aggiunge al volo
            if (!activeBundleKeys.has(key)) {
                activeBundleKeys.add(key);
                renderBundleChips();
            }
        }

        // CAMBIO SETTORE CON AGGIORNAMENTO BUNDLE PREDEFINITO
        function applySectorFilter() {
            const sector = document.getElementById('sector-advisor').value;
            
            if (!sector || sector === 'all') {
                document.getElementById('sector-count-badge').innerText = "21 Prodotti";
                activeBundleKeys = new Set([currentActiveKey]);
                renderGrid();
                renderBundleChips();
                return;
            }

            const reco = SECTOR_RECOMMENDATIONS[sector];
            if (!reco) return;

            const primarySet = new Set(reco.primary);
            const upsellSet = new Set(reco.upsell);

            // Preimposta il bundle con i prodotti primari del settore
            activeBundleKeys = new Set(reco.primary);

            const allKeys = Object.keys(SAAS_CATALOG);
            const sortedKeys = [
                ...reco.primary,
                ...reco.upsell,
                ...allKeys.filter(k => !primarySet.has(k) && !upsellSet.has(k))
            ];

            document.getElementById('sector-count-badge').innerText = `${reco.primary.length} Consigliati + ${reco.upsell.length} Up-sell`;
            renderGrid(sortedKeys, primarySet, upsellSet, true);

            if (reco.primary[0]) {
                selectSaas(reco.primary[0]);
            }
            renderBundleChips();
        }

        // CHIP DI SELEZIONE DEI PRODOTTI DA INCLUDERE NELLA DEMO
        function renderBundleChips() {
            const container = document.getElementById('bundle-chips-container');
            container.innerHTML = "";

            // Mostra tutti i prodotti del settore corrente + quelli attivi
            const sector = document.getElementById('sector-advisor').value;
            const relevantKeys = (sector && sector !== 'all' && SECTOR_RECOMMENDATIONS[sector])
                ? [...SECTOR_RECOMMENDATIONS[sector].primary, ...SECTOR_RECOMMENDATIONS[sector].upsell]
                : Object.keys(SAAS_CATALOG);

            const uniqueKeys = Array.from(new Set([...relevantKeys, ...activeBundleKeys]));

            uniqueKeys.forEach(key => {
                const item = SAAS_CATALOG[key];
                if (!item) return;

                const isChecked = activeBundleKeys.has(key);
                const chip = document.createElement('button');
                chip.type = 'button';
                chip.onclick = () => toggleBundleKey(key);
                chip.className = `bundle-chip px-2.5 py-1 rounded-xl text-[10px] font-bold border transition cursor-pointer whitespace-nowrap flex items-center gap-1 ${
                    isChecked 
                        ? 'active bg-purple-600 text-white border-purple-400' 
                        : 'bg-zinc-900 text-zinc-400 border-zinc-800 hover:text-white'
                }`;

                chip.innerHTML = `
                    <span>${item.emoji}</span>
                    <span>${item.name.replace('DriveMotion', 'DM')}</span>
                    ${isChecked ? '<i class="fa-solid fa-check text-[9px] ml-0.5"></i>' : ''}
                `;

                container.appendChild(chip);
            });
        }

        function toggleBundleKey(key) {
            if (activeBundleKeys.has(key)) {
                if (activeBundleKeys.size > 1) {
                    activeBundleKeys.delete(key);
                }
            } else {
                activeBundleKeys.add(key);
            }
            renderBundleChips();
        }

        // COMMUTATORE TRA MODALITÀ "INVIA DEMO" E "CHIUDI CON STRIPE"
        function switchLauncherTab(tab) {
            const isDemo = tab === 'demo';
            document.getElementById('panel-tab-demo').classList.toggle('hidden', !isDemo);
            document.getElementById('panel-tab-deal').classList.toggle('hidden', isDemo);

            document.getElementById('tab-btn-demo').className = isDemo
                ? "px-3 py-1 rounded-lg text-xs font-bold bg-purple-600 text-white transition cursor-pointer"
                : "px-3 py-1 rounded-lg text-xs font-bold text-zinc-400 hover:text-white transition cursor-pointer";

            document.getElementById('tab-btn-deal').className = !isDemo
                ? "px-3 py-1 rounded-lg text-xs font-bold bg-purple-600 text-white transition cursor-pointer"
                : "px-3 py-1 rounded-lg text-xs font-bold text-zinc-400 hover:text-white transition cursor-pointer";
        }

        // 💬 1. INVIO DEMO SU WHATSAPP (CON SUPPORTO MULTI-LINK PULITO)
        function sendDemoWhatsApp() {
            const leadName = document.getElementById('deal-lead-name').value.trim() || "Gentile Titolare";
            const leadPhone = document.getElementById('deal-lead-phone').value.trim();
            const cleanPhone = leadPhone ? leadPhone.replace(/[^0-9]/g, '') : '';

            const selectedItems = Array.from(activeBundleKeys).map(k => SAAS_CATALOG[k]).filter(Boolean);
            if (selectedItems.length === 0) return alert("Seleziona almeno un prodotto.");

            let msg = "";
            if (selectedItems.length === 1) {
                const item = selectedItems[0];
                msg = `Buongiorno ${leadName}. È stato un piacere incontrarla di persona! Come concordato, Le lascio il link per testare la piattaforma direttamente dal Suo smartphone senza installare nulla:\n\n${item.emoji} *${item.name}* (${item.tag}):\n👉 ${item.url}\n\nDagli un'occhiata con calma e mi faccia sapere cosa ne pensa! A presto, Riccardo Modena • RM Studio`;
            } else {
                msg = `Buongiorno ${leadName}. È stato un piacere incontrarla di persona! Come concordato, Le lascio i link diretti per testare le soluzioni di cui abbiamo parlato, direttamente dal Suo smartphone senza installare nulla:\n\n`;
                selectedItems.forEach(item => {
                    msg += `${item.emoji} *${item.name}* (${item.tag}):\n👉 ${item.url}\n\n`;
                });
                msg += `Può provarle comodamente dal telefono. Resto a Sua completa disposizione!\n\nUn cordiale saluto,\nRiccardo Modena • RM Studio (Tel. +39 349 525 8418)`;
            }

            const waUrl = cleanPhone 
                ? `https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`
                : `https://wa.me/?text=${encodeURIComponent(msg)}`;

            window.open(waUrl, '_blank');
        }

        // ✉️ 2. INVIO DEMO VIA EMAIL (RESEND VIA N8N)
        async function sendDemoEmail() {
            const leadName = document.getElementById('deal-lead-name').value.trim() || "Gentile Titolare";
            const leadEmail = document.getElementById('deal-lead-email').value.trim();

            if (!leadEmail || !leadEmail.includes('@')) {
                return alert("Inserisci un'email valida per la spedizione.");
            }

            const selectedItems = Array.from(activeBundleKeys).map(k => SAAS_CATALOG[k]).filter(Boolean);
            if (selectedItems.length === 0) return alert("Seleziona almeno un prodotto.");

            let linksText = "";
            selectedItems.forEach(item => {
                linksText += `- ${item.name} (${item.tag}): ${item.url}\n`;
            });

            const bodyText = `Gentile ${leadName},\n\nÈ stato un vero piacere incontrarla di persona oggi.\n\nCome concordato, Le trasmetto di seguito i link dedicati per accedere e testare direttamente le nostre piattaforme, ottimizzate per smartphone e desktop:\n\n${linksText}\nPuò provarle liberamente senza impegno. Resto a Sua completa disposizione per qualsiasi chiarimento tecnico.\n\nUn cordiale saluto,\nRiccardo Modena\nRM Studio • Soluzioni Software B2B\nTel / WhatsApp: +39 349 525 8418\nhttps://rmstudio.app`;

            const subject = `Link di prova e accesso alle piattaforme per ${leadName} • RM Studio`;

            try {
                showToast("Spedizione email in corso...");
                const res = await fetch('https://n8n.rmstudio.app/webhook/invia-email-proposta', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        to: leadEmail,
                        subject: subject,
                        body: bodyText,
                        client_name: leadName,
                        portal_type: "demo_launcher",
                        title: selectedItems.map(i => i.name).join(" + ")
                    })
                });

                if (res.ok) {
                    alert(`✨ Email con i link di prova recapitata con successo a: ${leadEmail}`);
                } else {
                    throw new Error(`HTTP ${res.status}`);
                }
            } catch (err) {
                alert("Errore invio email con Resend: " + err.message);
            }
        }

        // 📱 3. POPUP QR CODE ISTANTANEO (PER FARLO INQUADRARE SUBITO CON LA FOTOCAMERA)
        function openQrModal() {
            const item = SAAS_CATALOG[currentActiveKey];
            if (!item) return;

            const qrUrl = item.url;
            document.getElementById('qr-modal-title').innerText = `${item.emoji} ${item.name}`;
            document.getElementById('qr-modal-url').innerText = qrUrl;
            document.getElementById('qr-code-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=260x260&margin=10&data=${encodeURIComponent(qrUrl)}`;

            document.getElementById('qr-modal').classList.remove('hidden');
            document.getElementById('qr-modal').classList.add('flex');
        }

        function closeQrModal() {
            const m = document.getElementById('qr-modal');
            m.classList.remove('flex');
            m.classList.add('hidden');
        }

        // 💳 4. GENERAZIONE LINK STRIPE ON-THE-FLY CON PREZZO CONCORDATO
        async function generateSpecialStripeLink() {
            const item = SAAS_CATALOG[currentActiveKey];
            if (!item) return;

            const specialPrice = parseFloat(document.getElementById('special-price-input').value) || item.defaultPrice;
            const leadName = document.getElementById('deal-lead-name').value.trim() || "Cliente Riservato";
            const leadPhone = document.getElementById('deal-lead-phone').value.trim();

            const btn = document.getElementById('btn-stripe-deal');
            const origHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Genero Link...`;

            try {
                const res = await fetch('https://n8n.rmstudio.app/webhook/crea-sessione-stripe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        progetto: item.name,
                        portal_type: item.id,
                        title: `${item.name} • Offerta Speciale per ${leadName}`,
                        price: specialPrice,
                        ricarica_tipo: `deal_${item.id}`,
                        email: "cliente@rmstudio.app",
                        agency_id: leadName,
                        project_id: leadName,
                        origin: item.url,
                        success_url: `${item.url}/?success=true`,
                        cancel_url: `${item.url}/#prezzi`
                    })
                });

                const data = await res.json();
                if (data.url) {
                    await navigator.clipboard.writeText(data.url);
                    showToast(`✓ Link Stripe da €${specialPrice} copiato!`);

                    if (leadPhone) {
                        const cleanPhone = leadPhone.replace(/[^0-9]/g, '');
                        const msg = `Buongiorno ${leadName}. Come concordato di persona, Le ho generato il link per l'attivazione ufficiale di *${item.name}* alla tariffa speciale concordata di €${specialPrice}:\n👉 ${data.url}\n\nLa procedura si completa in 30 secondi con fattura immediata. Resto a disposizione!`;
                        if (confirm(`Link generato! Vuoi aprire la chat WhatsApp con ${leadName}?`)) {
                            window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`, '_blank');
                        }
                    }
                } else {
                    throw new Error("Sessione Stripe non ricevuta");
                }
            } catch (err) {
                alert("Errore generazione Stripe: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = origHtml;
            }
        }

        // 💬 5. INVIO MESSAGGIO OFFERTA SCONTATA
        function sendWhatsAppSpecialDeal() {
            const item = SAAS_CATALOG[currentActiveKey];
            if (!item) return;

            const specialPrice = parseFloat(document.getElementById('special-price-input').value) || item.defaultPrice;
            const leadName = document.getElementById('deal-lead-name').value.trim() || "Gentile Titolare";
            const leadPhone = document.getElementById('deal-lead-phone').value.trim();
            const cleanPhone = leadPhone ? leadPhone.replace(/[^0-9]/g, '') : '';

            const isDiscounted = specialPrice < item.defaultPrice;
            const priceText = isDiscounted 
                ? `alla tariffa agevolata di soli *€${specialPrice}* (anziché €${item.defaultPrice} di listino)`
                : `a soli *€${specialPrice}*`;

            const msg = `Buongiorno ${leadName}. In merito al nostro incontro odierno per *${item.name}*:\n👉 ${item.url}\n\nLe confermo la piena disponibilità ad attivare la soluzione per la Sua attività ${priceText} una tantum, senza canoni mensili vincolanti.\n\nResto a Sua disposizione per avviare la configurazione!`;

            const waUrl = cleanPhone 
                ? `https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`
                : `https://wa.me/?text=${encodeURIComponent(msg)}`;

            window.open(waUrl, '_blank');
        }

        function copyCurrentLinks() {
            const selectedItems = Array.from(activeBundleKeys).map(k => SAAS_CATALOG[k]).filter(Boolean);
            const urls = selectedItems.map(i => `${i.name}: ${i.url}`).join("\n");
            navigator.clipboard.writeText(urls).then(() => {
                showToast("✓ Link demo copiati!");
            });
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.innerText = text;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 2500);
        }

        document.addEventListener('DOMContentLoaded', () => {
            applySectorFilter();
        });
    </script>

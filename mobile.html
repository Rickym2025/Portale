<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RM Studio — Mobile Sales Launcher</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050508;
            color: #f3f4f6;
            font-size: 14px;
            -webkit-tap-highlight-color: transparent;
        }
        .font-display { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        .saas-card {
            min-height: 105px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .saas-card:active {
            transform: scale(0.96);
        }
        .saas-card.selected {
            border-color: #a855f7 !important;
            background: #131024 !important;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
        }
        .saas-card.is-primary {
            border-color: #10b981 !important;
            background: #091712 !important;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
        }
        .saas-card.is-upsell {
            border-color: #f59e0b !important;
            background: #17120a !important;
        }
        .saas-card.dimmed {
            opacity: 0.35;
            filter: grayscale(80%);
        }
    </style>
</head>
<body class="p-3.5 pb-44 min-h-screen flex flex-col justify-between selection:bg-purple-600 selection:text-white">

    <!-- HEADER MOBILE -->
    <header class="flex items-center justify-between pb-3.5 border-b border-zinc-900 mb-3">
        <div class="flex items-center gap-2.5">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-purple-600 via-pink-600 to-amber-500 flex items-center justify-center shadow-lg shadow-purple-600/30 shrink-0">
                <i class="fa-solid fa-bolt text-lg text-white"></i>
            </div>
            <div>
                <h1 class="font-display font-black text-white text-base leading-tight">Mobile Sales Launcher</h1>
                <span class="text-[11px] text-purple-400 font-bold">RM Studio • 21 SaaS Commerciali</span>
            </div>
        </div>
        <div class="flex items-center gap-1.5">
            <a href="listino-stripe.html" class="w-9 h-9 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-300 flex items-center justify-center text-xs font-bold active:scale-95" title="Listino Stripe">
                <i class="fa-solid fa-tags"></i>
            </a>
            <a href="index.html" class="w-9 h-9 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-300 flex items-center justify-center text-xs font-bold active:scale-95" title="Master Desktop">
                <i class="fa-solid fa-desktop"></i>
            </a>
        </div>
    </header>

    <main class="flex-1 space-y-3.5">
        
        <!-- SELETTORE SETTORE ECONOMICO DI RIFERIMENTO -->
        <div class="bg-[#0b0b12] border border-zinc-800 p-3.5 rounded-2xl space-y-2 shadow-xl">
            <label class="block text-xs font-black uppercase tracking-wider text-purple-300 flex items-center justify-between">
                <span>🎯 Settore di Attività del Lead</span>
                <span id="sector-count-badge" class="text-[10px] font-mono text-zinc-400">21 Prodotti</span>
            </label>
            <select id="sector-advisor" onchange="applySectorFilter()" class="w-full bg-[#13141f] border border-purple-500/40 focus:border-purple-400 rounded-xl p-3 text-xs text-white font-bold outline-none cursor-pointer">
                <option value="all">-- Mostra Tutti i 21 SaaS (Tutti i Settori) --</option>
                <option value="ristorazione" selected>🍽️ Ristoranti, Pizzerie, Bistrot &amp; Wine Bar</option>
                <option value="auto">🏎️ Concessionarie Auto, Saloni Usato &amp; Moto</option>
                <option value="architettura">🏛️ Architetti, Interior Designer &amp; Geometri</option>
                <option value="immobiliare">🏠 Agenzie Immobiliari &amp; Sviluppatori</option>
                <option value="medico">🦷 Studi Medici, Odontoiatri &amp; Cliniche</option>
                <option value="legale">⚖️ Studi Legali, Avvocati &amp; Commercialisti</option>
                <option value="hotel">🏨 Hotel, B&amp;B &amp; Agenzie Turistiche</option>
                <option value="funebre">🕊️ Onoranze Funebri &amp; Pet Memorials</option>
                <option value="wedding">💍 Wedding Planner &amp; Ricevimenti Nozze</option>
                <option value="palestra">🏋️ Palestre, Centri Fitness &amp; Personal Trainer</option>
                <option value="ecommerce">📦 E-Commerce, Retail &amp; Brand di Prodotto</option>
                <option value="fotovoltaico">☀️ Installatori Fotovoltaico &amp; Energie</option>
                <option value="ebike">⚡ Officine &amp; Rivenditori E-Bike (Bosch)</option>
                <option value="cantieri">🦺 Cantieri Edili &amp; Lavoratori Isolati (D.Lgs. 81/08)</option>
                <option value="vigilanza">🛡️ Istituti di Vigilanza &amp; Ronde Notturne</option>
                <option value="outdoor">📡 Caravan, Moto Pack &amp; Gruppi Outdoor</option>
                <option value="pmi">🏢 PMI, Liberi Professionisti &amp; Landing Web</option>
            </select>
        </div>

        <!-- GRIGLIA UNIFORME DINAMICA DEI 21 SAAS -->
        <div class="grid grid-cols-2 gap-2.5" id="saas-grid">
            <!-- Popolato e riordinato dinamicamente via JS -->
        </div>

    </main>

    <!-- CASSETTO STICKY IN BASSO: TRATTATIVA & GENERATORE PREZZO SPECIALE STRIPE -->
    <div class="fixed bottom-0 left-0 right-0 bg-[#090a10]/98 border-t border-purple-500/30 backdrop-blur-2xl p-3 z-50 shadow-2xl">
        <div class="max-w-md mx-auto space-y-2.5">
            
            <!-- Riga 1: Nome SaaS & Prezzo Speciale Trattativa -->
            <div class="flex items-center justify-between gap-3">
                <div class="min-w-0 flex-1">
                    <span id="bar-saas-title" class="font-display font-black text-white text-xs block truncate">Locanda Digitale</span>
                    <span id="bar-saas-tagline" class="text-[10px] text-zinc-400 block truncate">Living 3D &amp; Bancomat Compleanni</span>
                </div>
                
                <!-- INPUT PREZZO SPECIALE RISERVATO -->
                <div class="flex items-center gap-1.5 shrink-0 bg-[#141422] border border-purple-500/40 rounded-xl px-2 py-1">
                    <span class="text-[10px] text-zinc-400 font-mono">Prezzo: €</span>
                    <input type="number" id="special-price-input" step="1" class="w-16 bg-transparent text-white font-mono font-black text-sm text-center outline-none focus:text-purple-300" value="169" title="Modifica per applicare un prezzo speciale a questo cliente">
                </div>
            </div>

            <!-- Riga 2: Dati Lead Rapidi (Opzionali) -->
            <div class="grid grid-cols-2 gap-2">
                <input type="text" id="deal-lead-name" placeholder="Nome Lead / Attività" class="w-full bg-[#12131d] border border-zinc-800 rounded-lg px-2.5 py-1.5 text-xs text-white outline-none focus:border-purple-400">
                <input type="tel" id="deal-lead-phone" placeholder="Cell. WhatsApp (es: 349...)" class="w-full bg-[#12131d] border border-zinc-800 rounded-lg px-2.5 py-1.5 text-xs text-white outline-none focus:border-purple-400 font-mono">
            </div>

            <!-- Riga 3: Pulsanti Azione Rapida -->
            <div class="flex items-center gap-2">
                <!-- Tasto Stripe Link al Volo con Prezzo Personalizzato -->
                <button type="button" id="btn-stripe-deal" onclick="generateSpecialStripeLink()" class="flex-1 bg-gradient-to-r from-purple-600 via-indigo-600 to-blue-600 hover:brightness-110 text-white font-extrabold text-[11px] py-2.5 rounded-xl uppercase tracking-wider transition-all shadow-lg flex items-center justify-center gap-1.5 active:scale-95 cursor-pointer">
                    <i class="fa-brands fa-stripe text-sm"></i>
                    <span>Link Stripe €<span id="label-btn-price">169</span></span>
                </button>

                <!-- Tasto WhatsApp con Testo Offerta Convenzionata -->
                <button type="button" onclick="sendWhatsAppSpecialDeal()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-[11px] py-2.5 rounded-xl uppercase tracking-wider transition-all shadow-lg flex items-center justify-center gap-1.5 active:scale-95 cursor-pointer">
                    <i class="fa-brands fa-whatsapp text-sm"></i>
                    <span>Invia Offerta</span>
                </button>

                <!-- Copia URL Base SaaS -->
                <button type="button" onclick="copyCurrentSaasUrl()" class="w-10 h-10 bg-zinc-800 hover:bg-zinc-700 text-white rounded-xl flex items-center justify-center text-xs shrink-0 active:scale-90" title="Copia link sito">
                    <i class="fa-solid fa-copy"></i>
                </button>

                <!-- Apri Sito -->
                <a id="bar-open-btn" href="https://locandadigitale.rmstudio.app" target="_blank" class="w-10 h-10 bg-zinc-900 border border-zinc-800 text-purple-300 rounded-xl flex items-center justify-center text-xs shrink-0 active:scale-90" title="Apri demo">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </a>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICA COPIA -->
    <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 bg-purple-600 text-white text-xs font-black px-4 py-2 rounded-full shadow-2xl z-50 hidden transition-all">
        Link copiato negli appunti!
    </div>

    <script>
        // 📚 I 21 SAAS ATTIVI DI RM STUDIO CON PREZZI DI LISTINO DEFAULT
        const SAAS_CATALOG = {
            locanda: { id: "locanda", name: "Locanda Digitale", emoji: "🍽️", defaultPrice: 169, url: "https://locandadigitale.rmstudio.app", tag: "Living 3D & Compleanni", cat: "Horeca" },
            radar: { id: "radar", name: "DriveMotion RADAR", emoji: "🏎️", defaultPrice: 179, url: "https://drivemotion-radar.rmstudio.app", tag: "Sourcing Auto da Privati", cat: "Automotive" },
            forma_materia: { id: "forma_materia", name: "Forma & Materia", emoji: "🏛️", defaultPrice: 249, url: "https://formamateria.rmstudio.app", tag: "Schizzo to Render 4K", cat: "Architettura" },
            dentis: { id: "dentis", name: "Dentis AI", emoji: "🦷", defaultPrice: 149, url: "https://dentis.rmstudio.app", tag: "Receptionist Dentisti H24", cat: "Sanità" },
            lexis: { id: "lexis", name: "Lexis AI", emoji: "⚖️", defaultPrice: 149, url: "https://lexis.rmstudio.app", tag: "Segreteria Legale H24", cat: "Legale" },
            concierge: { id: "concierge", name: "Concierge24", emoji: "🏨", defaultPrice: 179, url: "https://concierge24.rmstudio.app", tag: "Voce H24 Hotel & B&B", cat: "Turismo" },
            sitengine: { id: "sitengine", name: "SiteEngine Pro", emoji: "🌐", defaultPrice: 400, url: "https://sitengine.rmstudio.app", tag: "Landing & Blog Smart", cat: "Web B2B" },
            hometour: { id: "hometour", name: "HomeTour", emoji: "🏠", defaultPrice: 59, url: "https://hometour.rmstudio.app", tag: "Reel Immobiliari 3D", cat: "Real Estate" },
            drivemotion: { id: "drivemotion", name: "DriveMotion", emoji: "🚗", defaultPrice: 59, url: "https://drivemotion.rmstudio.app", tag: "Video Auto Sfondo AI", cat: "Automotive" },
            vision: { id: "vision", name: "Vision UGC", emoji: "🎬", defaultPrice: 120, url: "https://vision.rmstudio.app", tag: "Influencer Virtuali AI", cat: "Video Marketing" },
            nexus: { id: "nexus", name: "NexusAI", emoji: "🤖", defaultPrice: 99, url: "https://nexus.rmstudio.app", tag: "Sales Overlay Chatbot", cat: "Lead Gen" },
            eternia: { id: "eternia", name: "ETERNIA", emoji: "🕊️", defaultPrice: 199, url: "https://eternia.rmstudio.app", tag: "Memoriali QR & Pet", cat: "Memorial" },
            love: { id: "love", name: "LOVE", emoji: "💍", defaultPrice: 249, url: "https://love.rmstudio.app", tag: "Partecipazioni 3D & Festa", cat: "Wedding" },
            ares: { id: "ares", name: "AresAI", emoji: "🏋️", defaultPrice: 99, url: "https://ares.rmstudio.app", tag: "Voice Trainer & Dieta AI", cat: "Fitness" },
            experience: { id: "experience", name: "Smart Experience", emoji: "🍷", defaultPrice: 390, url: "https://experience.rmstudio.app", tag: "Smart Page Ristoranti", cat: "Horeca" },
            social: { id: "social", name: "SocialEngine", emoji: "📊", defaultPrice: 79, url: "https://social.rmstudio.app", tag: "Carousel Creator AI", cat: "Social" },
            omniastudio: { id: "omniastudio", name: "OmniaStudio", emoji: "💼", defaultPrice: 699, url: "https://omniastudio.rmstudio.app", tag: "IA Offline Privata 100%", cat: "Legal/Fisco" },
            free_energy: { id: "free_energy", name: "Free Energy", emoji: "☀️", defaultPrice: 199, url: "https://free-energy.rmstudio.app", tag: "CAD Fotovoltaico & CRM", cat: "Solar" },
            velomotion: { id: "velomotion", name: "VeloMotion", emoji: "⚡", defaultPrice: 290, url: "https://velomotion.rmstudio.app", tag: "Sblocco Bosch BES3", cat: "E-Bike" },
            aura: { id: "aura", name: "AURA Proximity", emoji: "📡", defaultPrice: 19, url: "https://aura.rmstudio.app", tag: "Radar Mesh & Man-Down", cat: "Sicurezza" },
            ff_edizioni: { id: "ff_edizioni", name: "FF Edizioni", emoji: "🎵", defaultPrice: 300, url: "https://ff-edizioni.rmstudio.app", tag: "Jingle & Canzoni SIAE", cat: "Musica" }
        };

        // 🎯 MATRICE DI RACCOMANDAZIONE ECONOMICA SETTORIALE
        const SECTOR_RECOMMENDATIONS = {
            ristorazione: {
                primary: ['locanda', 'experience'],
                upsell: ['nexus', 'ff_edizioni', 'social']
            },
            auto: {
                primary: ['radar', 'drivemotion'],
                upsell: ['nexus', 'social']
            },
            architettura: {
                primary: ['forma_materia', 'sitengine'],
                upsell: ['social', 'hometour']
            },
            immobiliare: {
                primary: ['hometour', 'forma_materia'],
                upsell: ['sitengine', 'social']
            },
            medico: {
                primary: ['dentis', 'sitengine'],
                upsell: ['nexus']
            },
            legale: {
                primary: ['lexis', 'omniastudio'],
                upsell: ['sitengine', 'nexus']
            },
            hotel: {
                primary: ['concierge', 'aura'],
                upsell: ['nexus', 'social']
            },
            funebre: {
                primary: ['eternia', 'ff_edizioni'],
                upsell: ['nexus']
            },
            wedding: {
                primary: ['love', 'ff_edizioni'],
                upsell: ['vision']
            },
            palestra: {
                primary: ['ares', 'vision'],
                upsell: ['social', 'aura']
            },
            ecommerce: {
                primary: ['vision', 'nexus'],
                upsell: ['social', 'ff_edizioni']
            },
            fotovoltaico: {
                primary: ['free_energy', 'nexus'],
                upsell: ['dentis']
            },
            ebike: {
                primary: ['velomotion', 'nexus'],
                upsell: ['social']
            },
            cantieri: {
                primary: ['aura', 'forma_materia'],
                upsell: ['free_energy']
            },
            vigilanza: {
                primary: ['aura', 'omniastudio'],
                upsell: ['sitengine', 'nexus']
            },
            outdoor: {
                primary: ['aura', 'ares'],
                upsell: ['drivemotion']
            },
            pmi: {
                primary: ['sitengine', 'nexus'],
                upsell: ['omniastudio', 'social']
            }
        };

        let currentActiveKey = "locanda";

        // RENDER DELLA GRIGLIA UNIFORME
        function renderGrid(orderedKeys = Object.keys(SAAS_CATALOG), primarySet = new Set(), upsellSet = new Set(), hasSectorFilter = false) {
            const container = document.getElementById('saas-grid');
            container.innerHTML = "";

            orderedKeys.forEach(key => {
                const item = SAAS_CATALOG[key];
                if (!item) return;

                const isPrimary = primarySet.has(key);
                const isUpsell = upsellSet.has(key);
                const isDimmed = hasSectorFilter && !isPrimary && !isUpsell;

                let badgeHtml = `<span class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-zinc-800 text-zinc-300">${item.cat}</span>`;
                if (isPrimary) {
                    badgeHtml = `<span class="text-[9px] font-black px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/40">★ Primario</span>`;
                } else if (isUpsell) {
                    badgeHtml = `<span class="text-[9px] font-black px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/40">+ Up-sell</span>`;
                }

                const card = document.createElement('button');
                card.type = 'button';
                card.id = `card-${key}`;
                card.onclick = () => selectSaas(key);
                card.className = `saas-card p-3 bg-[#0c0c12] border border-zinc-800/90 rounded-2xl text-left flex flex-col justify-between cursor-pointer ${
                    key === currentActiveKey ? 'selected' : ''
                } ${isPrimary ? 'is-primary' : ''} ${isUpsell ? 'is-upsell' : ''} ${isDimmed ? 'dimmed' : ''}`;

                card.innerHTML = `
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-2xl">${item.emoji}</span>
                        ${badgeHtml}
                    </div>
                    <div>
                        <div class="flex items-baseline justify-between gap-1">
                            <span class="font-display font-extrabold text-white text-xs block truncate">${item.name}</span>
                            <span class="text-[10px] font-mono text-purple-400 font-bold shrink-0">€${item.defaultPrice}</span>
                        </div>
                        <span class="text-[10px] text-zinc-400 font-medium leading-tight block truncate mt-0.5">${item.tag}</span>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        // SELEZIONE SAAS E AGGIORNAMENTO CASSETTO INFERIORE
        function selectSaas(key) {
            currentActiveKey = key;
            const item = SAAS_CATALOG[key];
            if (!item) return;

            document.querySelectorAll('.saas-card').forEach(c => c.classList.remove('selected'));
            const card = document.getElementById(`card-${key}`);
            if (card) card.classList.add('selected');

            document.getElementById('bar-saas-title').innerText = `${item.emoji} ${item.name}`;
            document.getElementById('bar-saas-tagline').innerText = item.tag;
            document.getElementById('bar-open-btn').href = item.url;

            // Precompila il prezzo speciale con il default
            const priceInput = document.getElementById('special-price-input');
            priceInput.value = item.defaultPrice;
            document.getElementById('label-btn-price').innerText = item.defaultPrice;
        }

        // AGGIORNAMENTO DINAMICO LABEL TASTO QUANDO MODIFICHI IL PREZZO
        document.getElementById('special-price-input').addEventListener('input', (e) => {
            const val = e.target.value || "0";
            document.getElementById('label-btn-price').innerText = val;
        });

        // APPLICAZIONE FILTRO SETTORE INTELLIGENTE
        function applySectorFilter() {
            const sector = document.getElementById('sector-advisor').value;
            
            if (!sector || sector === 'all') {
                document.getElementById('sector-count-badge').innerText = "21 Prodotti";
                renderGrid();
                selectSaas('locanda');
                return;
            }

            const reco = SECTOR_RECOMMENDATIONS[sector];
            if (!reco) return;

            const primarySet = new Set(reco.primary);
            const upsellSet = new Set(reco.upsell);

            // Riordina: prima i Primari, poi gli Up-sell, poi gli altri
            const allKeys = Object.keys(SAAS_CATALOG);
            const sortedKeys = [
                ...reco.primary,
                ...reco.upsell,
                ...allKeys.filter(k => !primarySet.has(k) && !upsellSet.has(k))
            ];

            document.getElementById('sector-count-badge').innerText = `${reco.primary.length} Consigliati + ${reco.upsell.length} Up-sell`;
            renderGrid(sortedKeys, primarySet, upsellSet, true);

            // Seleziona automaticamente il primo primario
            if (reco.primary[0]) {
                selectSaas(reco.primary[0]);
            }
        }

        // ⚡ 1. GENERAZIONE LINK STRIPE ON-THE-FLY CON PREZZO SPECIALE RISERVATO
        async function generateSpecialStripeLink() {
            const item = SAAS_CATALOG[currentActiveKey];
            if (!item) return;

            const specialPrice = parseFloat(document.getElementById('special-price-input').value) || item.defaultPrice;
            const leadName = document.getElementById('deal-lead-name').value.trim() || "Cliente Riservato";
            const leadPhone = document.getElementById('deal-lead-phone').value.trim() || "";

            const btn = document.getElementById('btn-stripe-deal');
            const origHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Creo Link...`;

            try {
                const res = await fetch('https://n8n.rmstudio.app/webhook/crea-sessione-stripe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        progetto: item.name,
                        portal_type: item.id,
                        title: `${item.name} • Offerta Dedicata per ${leadName}`,
                        price: specialPrice,
                        ricarica_tipo: `deal_${item.id}`,
                        email: "cliente@rmstudio.app",
                        agency_id: leadName,
                        project_id: leadName,
                        origin: item.url,
                        success_url: `${item.url}/?success=true`,
                        cancel_url: `${item.url}/#prezzi`
                    })
                });

                const data = await res.json();
                if (data.url) {
                    await navigator.clipboard.writeText(data.url);
                    showToast(`✓ Link Stripe da €${specialPrice} copiato negli appunti!`);

                    // Se è inserito il telefono, chiedi se vuole aprire WhatsApp
                    if (leadPhone) {
                        const cleanPhone = leadPhone.replace(/[^0-9]/g, '');
                        const msg = `Ciao ${leadName}! Come concordato, ti ho attivato la tariffa riservata per *${item.name}* a soli €${specialPrice} (invece di €${item.defaultPrice}). Puoi completare l'attivazione ufficiale in 30 secondi da questo link sicuro Stripe:\n👉 ${data.url}`;
                        if (confirm(`Link generato! Vuoi aprire la chat WhatsApp con ${leadName}?`)) {
                            window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`, '_blank');
                        }
                    }
                } else {
                    throw new Error("URL sessione non ricevuto");
                }
            } catch (err) {
                alert("Errore generazione Stripe al volo: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = origHtml;
            }
        }

        // 💬 2. INVIO OFFERTA SPECIALE PRECOMPILATA SU WHATSAPP
        function sendWhatsAppSpecialDeal() {
            const item = SAAS_CATALOG[currentActiveKey];
            if (!item) return;

            const specialPrice = parseFloat(document.getElementById('special-price-input').value) || item.defaultPrice;
            const leadName = document.getElementById('deal-lead-name').value.trim() || "Titolare";
            const leadPhone = document.getElementById('deal-lead-phone').value.trim();
            const cleanPhone = leadPhone ? leadPhone.replace(/[^0-9]/g, '') : '';

            const isDiscounted = specialPrice < item.defaultPrice;
            const priceText = isDiscounted 
                ? `alla tariffa agevolata di soli *€${specialPrice}* (anziché €${item.defaultPrice} di listino)`
                : `a soli *€${specialPrice}*`;

            const msg = `Ciao ${leadName}! 👋\n\nStavo verificando la configurazione per la tua attività con *${item.name}*:\n👉 ${item.url}\n\nPer consentirti di partire subito, ti confermo la disponibilità ad attivare la soluzione ${priceText} senza canoni vincolanti.\n\nFammi sapere se per te va bene così procediamo con l'attivazione! 😊`;

            const waUrl = cleanPhone 
                ? `https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`
                : `https://wa.me/?text=${encodeURIComponent(msg)}`;

            window.open(waUrl, '_blank');
        }

        function copyCurrentSaasUrl() {
            const url = SAAS_CATALOG[currentActiveKey]?.url || "https://rmstudio.app";
            navigator.clipboard.writeText(url).then(() => {
                showToast("✓ Link demo copiato!");
            });
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.innerText = text;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 2500);
        }

        document.addEventListener('DOMContentLoaded', () => {
            applySectorFilter();
        });
    </script>
</body>
</html>

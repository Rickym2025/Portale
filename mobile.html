<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RM Studio — Mobile Sales Pistol</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050508;
            color: #f3f4f6;
            font-size: 16px;
            -webkit-tap-highlight-color: transparent;
        }
        .font-display { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        @keyframes glow-pulse {
            0%, 100% {
                border-color: #06b6d4;
                box-shadow: 0 0 15px rgba(6, 182, 212, 0.6), inset 0 0 10px rgba(6, 182, 212, 0.2);
                transform: scale(1.02);
            }
            50% {
                border-color: #8b5cf6;
                box-shadow: 0 0 25px rgba(139, 92, 246, 0.8), inset 0 0 15px rgba(139, 92, 246, 0.3);
                transform: scale(1.04);
            }
        }
        .glow-suggested {
            animation: glow-pulse 2s infinite ease-in-out !important;
            border-width: 2px !important;
        }
        .saas-card {
            transition: all 0.2s ease-in-out;
        }
        .saas-card:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body class="p-4 min-h-screen flex flex-col justify-between selection:bg-purple-600 selection:text-white">

    <!-- HEADER MOBILE -->
    <header class="flex items-center justify-between pb-4 border-b border-zinc-900 mb-4">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-purple-600 via-pink-600 to-amber-500 flex items-center justify-center shadow-lg shadow-purple-600/30 shrink-0">
                <i class="fa-solid fa-bolt text-2xl text-white"></i>
            </div>
            <div>
                <h1 class="font-display font-black text-white text-base leading-tight">Mobile Lead Pistol</h1>
                <span class="text-xs text-purple-400 font-bold">RM Studio Ecosystem</span>
            </div>
        </div>
        <a href="index.html" class="w-11 h-11 rounded-2xl bg-zinc-900 border border-zinc-800 text-gray-300 flex items-center justify-center text-sm font-bold active:scale-95" title="Master Hub Desktop">
            <i class="fa-solid fa-desktop text-base"></i>
        </a>
    </header>

    <main class="flex-1 space-y-4">
        
        <!-- GUIDA DINAMICA SETTORE CON GLOW -->
        <div class="bg-zinc-900/90 border border-zinc-800 p-4 rounded-2xl space-y-2">
            <label class="block text-sm font-black uppercase tracking-wider text-purple-300 flex items-center justify-between">
                <span>💡 Che settore ha il tuo Lead?</span>
                <i class="fa-solid fa-wand-magic-sparkles text-amber-400 text-base"></i>
            </label>
            <select id="sector-advisor" onchange="highlightSuggestedSaas()" class="w-full bg-[#151522] border border-purple-500/50 rounded-xl p-3 text-sm text-white font-extrabold outline-none focus:border-purple-400">
                <option value="">-- Mostra tutti i SaaS --</option>
                <option value="funebre">🕊️ Onoranze Funebri / Cremazioni Pet</option>
                <option value="ristorante">🍷 Ristorante / Bar / Pizzeria</option>
                <option value="hotel">🏨 Hotel / B&amp;B / Struttura Ricettiva</option>
                <option value="auto">🏎️ Concessionaria Auto / Salone Moto</option>
                <option value="immobile">🏠 Agenzia Immobiliare</option>
                <option value="medico">🦷 Studio Dentistico / Clinica</option>
                <option value="legale">⚖️ Studio Legale / Avvocato</option>
                <option value="palestra">🏋️ Palestra / Centro Fitness</option>
                <option value="ecommerce">📦 E-Commerce / Brand Prodotto</option>
                <option value="evento">💍 Matrimoni / Eventi / Feste</option>
                <option value="azienda">🏢 Azienda / Attività Generica</option>
            </select>
        </div>

        <!-- ECOSISTEMA TUTTI I SAAS -->
        <div>
            <label class="block text-xs font-black uppercase tracking-widest text-gray-400 mb-3">
                Seleziona il Prodotto (1-Tap per Aprire):
            </label>

            <div class="grid grid-cols-2 gap-2.5">
                
                <!-- ⚡ ETERNIA (MEMORIALI QR & PET) -->
                <button type="button" onclick="handleSaasTap('eternia', 'https://eternia.rmstudio.app')" id="card-eternia" class="saas-card p-3.5 bg-[#0e0e14] border border-amber-500/40 rounded-2xl text-left flex flex-col gap-1 relative overflow-hidden">
                    <span class="text-2xl">🕊️</span>
                    <span class="font-black text-amber-200 text-sm">ETERNIA</span>
                    <span class="text-xs text-amber-400 font-bold">Memoriali QR &amp; Pet</span>
                </button>

                <button type="button" onclick="handleSaasTap('love', 'https://love.rmstudio.app')" id="card-love" class="saas-card p-3.5 bg-[#0e0e14] border border-zinc-800 rounded-2xl text-left flex flex-col gap-1 relative overflow-hidden">
                    <span class="text-2xl">💍</span>
                    <span class="font-black text-white text-sm">LOVE</span>
                    <span class="text-xs text-amber-300 font-bold">Partecipazioni &amp; Festa</span>
                </button>

                <button type="button" onclick="handleSaasTap('experience', 'https://experience.rmstudio.app')" id="card-experience" class="saas-card p-3.5 bg-[#0e0e14] border border-zinc-800 rounded-2xl text-left flex flex-col gap-1 relative overflow-hidden">
                    <span class="text-2xl">🍷</span>
                    <span class="font-black text-white text-sm">Experience</span>
                    <span class="text-xs text-amber-400 font-bold">Smart Page Ristoranti</span>
                </button>

                <button type="button" onclick="handleSaasTap('social', 'https://social.rmstudio.app')" id="card-social" class="saas-card p-3.5 bg-[#0e0e14] border border-zinc-800 rounded-2xl text-left flex flex-col gap-1 relative overflow-hidden">
                    <span class="text-2xl">📊</span>
                    <span class="font-black text-white text-sm">SocialEngine</span>
                    <span class="text-xs text-indigo-400 font-bold">Carousel AI Creator</span>
                </button>

                <button type="button" onclick="handleSaasTap('nexus', 'https://nexus.rmstudio.app')" id="card-nexus" class="saas-card p-3.5 bg-[#0e0e14] border border-zinc-800 rounded-2xl text-left flex flex-col gap-1 relative overflow-hidden">
                    <span class="text-2xl">🤖</span>
                    <span class="font-black text-white text-sm">NexusAI</span>
                    <span class="text-xs text-cyan-400 font-bold">Sales Overlay Chatbot</span>
                </button>

                <button type="button" onclick="handleSaasTap('drivemotion', 'https://drivemotion.rmstudio.app')" id="card-drivemotion" class="saas-card p-3.5 bg-[#0e0e14] border border-zinc-800 rounded-2xl text-left flex flex-col gap-1 relative overflow-hidden">
                    <span class="text-2xl">🏎️</span>
                    <span class="font-black text-white text-sm">DriveMotion</span>
                    <span class="text-xs text-cyan-400 font-bold">Video Auto Sfondo AI</span>
                </button>

                <button type="button" onclick="handleSaasTap('hometour', 'https://hometour.rmstudio.app')" id="card-hometour" class="saas-card p-3.5 bg-[#0e0e14] border border-zinc-800 rounded-2xl text-left flex flex-col gap-1 relative overflow-hidden">
                    <span class="text-2xl">🏠</span>
                    <span class="font-black text-white text-sm">HomeTour</span>
                    <span class="text-xs text-emerald-400 font-bold">Video Immobili 3D</span>
                </button>

                <button type="button" onclick="handleSaasTap('dentis', 'https://dentis.rmstudio.app')" id="card-dentis" class="saas-card p-3.5 bg-[#0e0e14] border border-zinc-800 rounded-2xl text-left flex flex-col gap-1 relative overflow-hidden">
                    <span class="text-2xl">🦷</span>
                    <span class="font-black text-white text-sm">Dentis AI</span>
                    <span class="text-xs text-cyan-300 font-bold">Voice AI Dentisti H24</span>
                </button>

                <button type="button" onclick="handleSaasTap('lexis', 'https://lexis.rmstudio.app')" id="card-lexis" class="saas-card p-3.5 bg-[#0e0e14] border border-zinc-800 rounded-2xl text-left flex flex-col gap-1 relative overflow-hidden">
                    <span class="text-2xl">⚖️</span>
                    <span class="font-black text-white text-sm">Lexis AI</span>
                    <span class="text-xs text-amber-300 font-bold">Voice AI Studi Legali</span>
                </button>

                <button type="button" onclick="handleSaasTap('concierge24', 'https://concierge24.rmstudio.app')" id="card-concierge24" class="saas-card p-3.5 bg-[#0e0e14] border border-zinc-800 rounded-2xl text-left flex flex-col gap-1 relative overflow-hidden">
                    <span class="text-2xl">🏨</span>
                    <span class="font-black text-white text-sm">Concierge24</span>
                    <span class="text-xs text-orange-400 font-bold">Voice AI Hotel/B&amp;B</span>
                </button>

                <button type="button" onclick="handleSaasTap('ares', 'https://ares.rmstudio.app')" id="card-ares" class="saas-card p-3.5 bg-[#0e0e14] border border-zinc-800 rounded-2xl text-left flex flex-col gap-1 relative overflow-hidden">
                    <span class="text-2xl">🏋️</span>
                    <span class="font-black text-white text-sm">AresAI</span>
                    <span class="text-xs text-purple-400 font-bold">Voice Trainer &amp; Dieta</span>
                </button>

                <button type="button" onclick="handleSaasTap('vision', 'https://vision.rmstudio.app')" id="card-vision" class="saas-card p-3.5 bg-[#0e0e14] border border-zinc-800 rounded-2xl text-left flex flex-col gap-1 relative overflow-hidden">
                    <span class="text-2xl">🎬</span>
                    <span class="font-black text-white text-sm">Vision UGC</span>
                    <span class="text-xs text-pink-400 font-bold">Model Virtual Camila</span>
                </button>

                <button type="button" onclick="handleSaasTap('sitengine', 'https://sitengine.rmstudio.app')" id="card-sitengine" class="saas-card p-3.5 bg-[#0e0e14] border border-zinc-800 rounded-2xl text-left flex flex-col gap-1 relative overflow-hidden">
                    <span class="text-2xl">🌐</span>
                    <span class="font-black text-white text-sm">SiteEngine</span>
                    <span class="text-xs text-blue-400 font-bold">Landing Professionisti</span>
                </button>

                <button type="button" onclick="handleSaasTap('omniastudio', 'https://omniastudio.rmstudio.app')" id="card-omniastudio" class="saas-card p-3.5 bg-[#0e0e14] border border-zinc-800 rounded-2xl text-left flex flex-col gap-1 relative overflow-hidden">
                    <span class="text-2xl">💼</span>
                    <span class="font-black text-white text-sm">OmniaStudio</span>
                    <span class="text-xs text-[#a855f7] font-bold">IA Offline Privata PC</span>
                </button>

                <button type="button" onclick="handleSaasTap('ff_edizioni', 'https://ff-edizioni.rmstudio.app')" id="card-ff_edizioni" class="saas-card p-3.5 bg-[#0e0e14] border border-zinc-800 rounded-2xl text-left flex flex-col gap-1 relative overflow-hidden">
                    <span class="text-2xl">🎵</span>
                    <span class="font-black text-white text-sm">FF Edizioni</span>
                    <span class="text-xs text-purple-400 font-bold">Jingle &amp; Canzoni Custom</span>
                </button>

                <button type="button" onclick="handleSaasTap('free_energy', 'https://free-energy.rmstudio.app')" id="card-free_energy" class="saas-card p-3.5 bg-[#0e0e14] border border-zinc-800 rounded-2xl text-left flex flex-col gap-1 relative overflow-hidden">
                    <span class="text-2xl">☀️</span>
                    <span class="font-black text-white text-sm">Free Energy</span>
                    <span class="text-xs text-emerald-400 font-bold">CRM PV Planner CAD</span>
                </button>

                <button type="button" onclick="handleSaasTap('velomotion', 'https://velomotion.rmstudio.app')" id="card-velomotion" class="saas-card col-span-2 p-3.5 bg-[#0e0e14] border border-zinc-800 rounded-2xl text-left flex flex-col gap-1 relative overflow-hidden">
                    <span class="text-2xl">⚡</span>
                    <span class="font-black text-white text-sm">VeloMotion (Sblocco Bosch BES3)</span>
                    <span class="text-xs text-yellow-400 font-bold">Software sicuro ed invisibile</span>
                </button>

                <button type="button" onclick="handleSaasTap('locanda', 'https://locandadigitale.rmstudio.app')" id="card-locanda" class="saas-card p-3.5 bg-[#0e0e14] border border-amber-500/40 rounded-2xl text-left flex flex-col gap-1 relative overflow-hidden">
                    <span class="text-2xl">🍽️</span>
                    <span class="font-black text-amber-200 text-sm">Locanda Digitale</span>
                    <span class="text-xs text-amber-400 font-bold">Video 3D &amp; Menu QR</span>
                </button>

            </div>
        </div>

        <!-- LANDING PAGE UFFICIALE SELEZIONATA -->
        <div class="flex justify-between items-center bg-zinc-900/60 border border-zinc-800 px-3.5 py-2 rounded-xl text-xs">
            <span class="text-gray-400 font-semibold" id="saas-desc-label">Memoriali QR d'Autore &amp; Pet</span>
            <a id="saas-landing-link" href="https://eternia.rmstudio.app" target="_blank" class="text-amber-300 font-bold hover:underline flex items-center gap-1 text-xs">
                <span>🔗 Apri Landing</span> <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
            </a>
        </div>

        <!-- ⚡ SEZIONE GENERATORE RAPIDO STRIPE ON-THE-FLY -->
        <div class="p-4 bg-gradient-to-br from-purple-950/40 via-zinc-900 to-zinc-950 border border-purple-500/40 rounded-2xl space-y-3">
            <div class="flex items-center justify-between">
                <span class="text-xs font-black uppercase tracking-wider text-purple-300 flex items-center gap-2">
                    <i class="fa-brands fa-stripe text-xl text-purple-400"></i> Generatore Link Stripe Istantaneo
                </span>
                <a href="stripe-generator.html" class="text-[10px] text-amber-400 font-bold underline">Apri Pagina Dedicata ↗</a>
            </div>
            <p class="text-xs text-gray-400 leading-snug">
                Crea qualsiasi importo al volo senza creare prodotti su Stripe.
            </p>
        </div>

    </main>

    <footer class="pt-4 text-center text-xs text-gray-500 font-bold">
        RM Studio Mobile Sales Launcher © 2026
    </footer>

    <script>
        const SAAS_CONFIG = {
            eternia: { landing: "https://eternia.rmstudio.app", desc: "Memoriali QR d'Autore & Pet Memorials" },
            experience: {
                title: "Dati Smart Experience Page (Ristoranti):",
                endpoint: "https://n8n.rmstudio.app/webhook/omnia-taste-generate",
                landing: "https://experience.rmstudio.app",
                desc: "Smart Page Ristoranti",
                showProduct: false,
                lblUrl: "URL Sito Web Ristorante:",
                lblName: "Nome Ristorante / Titolare:"
            },
            social: {
                title: "Dati Carousel Creator (SocialEngine):",
                endpoint: "https://n8n.rmstudio.app/webhook/omnia-quick-generate",
                landing: "https://social.rmstudio.app",
                desc: "Carousel Creator (SocialEngine)",
                showProduct: true,
                lblUrl: "URL Sito Web o Link Social Cliente:",
                lblName: "Nome Brand / Attività:"
            },
            nexus: {
                title: "Dati NexusAI Sales Overlay:",
                endpoint: "https://n8n.rmstudio.app/webhook/chatbot-creator",
                landing: "https://nexus.rmstudio.app",
                desc: "AI Sales Overlay Chatbot",
                showProduct: false,
                lblUrl: "URL Sito Web del Cliente:",
                lblName: "Nome Azienda / Brand:"
            },
            love: { landing: "https://love.rmstudio.app", desc: "Partecipazioni Digitali & Maxischermo Festa" },
            ares: { landing: "https://ares.rmstudio.app", desc: "Fitness RPG, Voice AI & Maxischermo TV" },
            omniastudio: { landing: "https://omniastudio.rmstudio.app", desc: "IA Offline Privata 100%" },
            sitengine: { landing: "https://sitengine.rmstudio.app", desc: "Landing Page Professionisti" },
            vision: { landing: "https://vision.rmstudio.app", desc: "Video Influencer AI" },
            hometour: { landing: "https://hometour.rmstudio.app", desc: "Video Regia AI Immobili" },
            drivemotion: { landing: "https://drivemotion.rmstudio.app", desc: "Video Auto Sfondo AI" },
            dentis: { landing: "https://dentis.rmstudio.app", desc: "Voice AI Dentis" },
            lexis: { landing: "https://lexis.rmstudio.app", desc: "Voice AI Lexis" },
            concierge24: { landing: "https://concierge24.rmstudio.app", desc: "Voice AI Hotel" },
            ff_edizioni: { landing: "https://ff-edizioni.rmstudio.app", desc: "Canzoni & Jingle Custom" },
            free_energy: { landing: "https://free-energy.rmstudio.app", desc: "Fotovoltaico B2B CRM" },
            velomotion: { landing: "https://velomotion.rmstudio.app", desc: "Sblocco Bosch BES3" }
        };

        function handleSaasTap(key, landingUrl) {
            document.getElementById('saas-desc-label').innerText = SAAS_CONFIG[key]?.desc || key;
            document.getElementById('saas-landing-link').href = landingUrl;
            window.open(landingUrl, '_blank');
        }

        function highlightSuggestedSaas() {
            const sector = document.getElementById('sector-advisor').value;
            document.querySelectorAll('.saas-card').forEach(c => c.classList.remove('glow-suggested'));

            if (!sector) return;

            const suggestions = {
                funebre: ['card-eternia', 'card-ff_edizioni', 'card-nexus', 'card-dentis'],
                ristorante: ['card-experience', 'card-nexus', 'card-ff_edizioni', 'card-social'],
                hotel: ['card-concierge24', 'card-nexus', 'card-ff_edizioni', 'card-social'],
                auto: ['card-drivemotion', 'card-nexus', 'card-dentis', 'card-social'],
                immobile: ['card-hometour', 'card-nexus', 'card-sitengine', 'card-social'],
                medico: ['card-dentis', 'card-nexus', 'card-sitengine', 'card-social'],
                legale: ['card-lexis', 'card-omniastudio', 'card-nexus', 'card-sitengine', 'card-social'],
                palestra: ['card-ares', 'card-nexus', 'card-ff_edizioni', 'card-vision', 'card-social'],
                ecommerce: ['card-vision', 'card-nexus', 'card-ff_edizioni', 'card-social'],
                evento: ['card-love', 'card-ff_edizioni', 'card-vision', 'card-social'],
                azienda: ['card-omniastudio', 'card-nexus', 'card-dentis', 'card-sitengine', 'card-social'],
                ristorante: ['card-locanda', 'card-experience', 'card-nexus', 'card-ff_edizioni'],
            };

            const targetCardIds = suggestions[sector] || ['card-eternia', 'card-nexus'];
            targetCardIds.forEach(id => {
                const card = document.getElementById(id);
                if (card) card.classList.add('glow-suggested');
            });
        }
    </script>
</body>
</html>

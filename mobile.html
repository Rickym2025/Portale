<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RM Studio — Mobile Sales Engine</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050508;
            color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        .font-display { font-family: 'Plus Jakarta Sans', sans-serif; }
        .saas-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .saas-card.selected {
            border-color: #a855f7 !important;
            background: rgba(168, 85, 247, 0.18) !important;
            transform: scale(1.02);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.35);
        }
    </style>
</head>
<body class="p-4 min-h-screen flex flex-col justify-between selection:bg-purple-600 selection:text-white">

    <!-- HEADER MOBILE -->
    <header class="flex items-center justify-between pb-3 border-b border-zinc-900 mb-4">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center shadow-lg shadow-purple-600/30">
                <i class="fa-solid fa-bolt text-lg text-white"></i>
            </div>
            <div>
                <h1 class="font-display font-black text-white text-base leading-tight">Mobile Lead Pistol</h1>
                <span class="text-xs text-purple-400 font-bold">RM Studio Ecosystem</span>
            </div>
        </div>
        <a href="index.html" class="w-9 h-9 rounded-xl bg-zinc-900 border border-zinc-800 text-gray-400 flex items-center justify-center text-xs font-bold" title="Master Hub Desktop">
            <i class="fa-solid fa-desktop"></i>
        </a>
    </header>

    <main class="flex-1 space-y-4">
        
        <!-- 💡 GUIDA DINAMICA PER SETTORE -->
        <div class="bg-purple-950/40 border border-purple-500/30 p-3.5 rounded-2xl space-y-2">
            <label class="block text-xs font-extrabold uppercase text-purple-300 flex items-center justify-between">
                <span>💡 Che settore stai visitando ora?</span>
                <i class="fa-solid fa-lightbulb text-amber-400"></i>
            </label>
            <select id="sector-advisor" onchange="adviseSaasBySector()" class="w-full bg-[#151520] border border-purple-500/40 rounded-xl p-2.5 text-xs text-white font-bold outline-none">
                <option value="">-- Seleziona il Settore del Cliente --</option>
                <option value="ristorante">🍷 Ristorante / Bar / Pizzeria</option>
                <option value="hotel">🏨 Hotel / B&B / Resort</option>
                <option value="evento">🎵 Matrimoni / Eventi / Regali (FF Edizioni)</option>
                <option value="auto">🏎️ Concessionaria Auto / Moto</option>
                <option value="immobile">🏠 Agenzia Immobiliare</option>
                <option value="medico">🦷 Studio Medico / Dentista</option>
                <option value="legale">⚖️ Studio Legale / Avvocato</option>
                <option value="palestra">🏋️ Palestra / Centro Fitness</option>
                <option value="ecommerce">📦 E-Commerce / Brand Prodotto</option>
            </select>
            <p id="advisor-tip" class="text-[11px] text-purple-200/80 leading-relaxed hidden italic pt-1"></p>
        </div>

        <!-- SELEZIONE SAAS -->
        <div>
            <label class="block text-xs font-black uppercase tracking-wider text-gray-400 mb-2">
                Scegli il Prodotto da Proporre:
            </label>

            <div class="grid grid-cols-2 gap-2">
                
                <button type="button" onclick="selectSaas('experience')" id="card-experience" class="saas-card selected p-3 bg-[#0e0e14] border border-zinc-800 rounded-2xl text-left flex flex-col gap-1">
                    <span class="text-xl">🍷</span>
                    <span class="font-extrabold text-white text-xs">Experience</span>
                    <span class="text-[9px] text-gray-400 font-bold">Smart Page Ristoranti</span>
                </button>

                <button type="button" onclick="selectSaas('ff_edizioni')" id="card-ff_edizioni" class="saas-card p-3 bg-[#0e0e14] border border-zinc-800 rounded-2xl text-left flex flex-col gap-1">
                    <span class="text-xl">🎵</span>
                    <span class="font-extrabold text-white text-xs">FF Edizioni</span>
                    <span class="text-[9px] text-amber-400 font-bold">Jingle & Canzoni Custom</span>
                </button>

                <button type="button" onclick="selectSaas('nexus')" id="card-nexus" class="saas-card p-3 bg-[#0e0e14] border border-zinc-800 rounded-2xl text-left flex flex-col gap-1">
                    <span class="text-xl">🤖</span>
                    <span class="font-extrabold text-white text-xs">NexusAI</span>
                    <span class="text-[9px] text-gray-400 font-bold">Sales Overlay Chatbot</span>
                </button>

                <button type="button" onclick="selectSaas('sitengine')" id="card-sitengine" class="saas-card p-3 bg-[#0e0e14] border border-zinc-800 rounded-2xl text-left flex flex-col gap-1">
                    <span class="text-xl">🌐</span>
                    <span class="font-extrabold text-white text-xs">SiteEngine Pro</span>
                    <span class="text-[9px] text-gray-400 font-bold">Landing Professionisti</span>
                </button>

                <button type="button" onclick="selectSaas('vision')" id="card-vision" class="saas-card p-3 bg-[#0e0e14] border border-zinc-800 rounded-2xl text-left flex flex-col gap-1">
                    <span class="text-xl">🎬</span>
                    <span class="font-extrabold text-white text-xs">Vision UGC</span>
                    <span class="text-[9px] text-gray-400 font-bold">Video Influencer AI</span>
                </button>

                <button type="button" onclick="selectSaas('hometour')" id="card-hometour" class="saas-card p-3 bg-[#0e0e14] border border-zinc-800 rounded-2xl text-left flex flex-col gap-1">
                    <span class="text-xl">🏠</span>
                    <span class="font-extrabold text-white text-xs">HomeTour / Drive</span>
                    <span class="text-[9px] text-gray-400 font-bold">Video Immobili & Auto</span>
                </button>

                <button type="button" onclick="selectSaas('voice_ai')" id="card-voice_ai" class="saas-card col-span-2 p-3 bg-[#0e0e14] border border-zinc-800 rounded-2xl text-left flex flex-col gap-1">
                    <span class="text-xl">📞</span>
                    <span class="font-extrabold text-white text-xs">Voice AI H24 (Dentis / Lexis / Concierge24)</span>
                    <span class="text-[9px] text-gray-400 font-bold">Receptionist Telefonica Parlante</span>
                </button>

            </div>
        </div>

        <!-- LANDING PAGE UFFICIALE -->
        <div class="flex justify-between items-center bg-zinc-900/60 border border-zinc-800 px-3.5 py-2 rounded-xl text-xs">
            <span class="text-gray-400 font-semibold" id="saas-desc-label">Smart Page Ristoranti</span>
            <a id="saas-landing-link" href="https://experience.rmstudio.app" target="_blank" class="text-purple-400 font-bold hover:underline flex items-center gap-1 text-xs">
                <span>🔗 Apri Landing</span> <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
            </a>
        </div>

        <!-- FORM DINAMICO -->
        <div class="space-y-3 bg-[#0e0e14] border border-zinc-800 p-4 rounded-2xl">
            <div class="flex items-center justify-between border-b border-zinc-800 pb-2">
                <label class="text-xs font-black uppercase tracking-wider text-purple-400" id="saas-form-title">
                    Dati Generazione Experience:
                </label>
            </div>

            <div id="box-url">
                <label class="block text-[11px] font-bold text-gray-400 mb-1" id="lbl-url">URL Sito Web Cliente:</label>
                <input type="url" id="inp-url" placeholder="https://www.ristorante.it" class="w-full bg-[#151520] border border-zinc-800 rounded-xl p-3 text-xs text-white outline-none focus:border-purple-500 font-mono">
            </div>

            <div id="box-name">
                <label class="block text-[11px] font-bold text-gray-400 mb-1" id="lbl-name">Nome Attività / Titolare:</label>
                <input type="text" id="inp-name" placeholder="Es. Osteria dal Conte" class="w-full bg-[#151520] border border-zinc-800 rounded-xl p-3 text-sm text-white outline-none focus:border-purple-500 font-bold">
            </div>

            <div id="box-city" class="hidden">
                <label class="block text-[11px] font-bold text-gray-400 mb-1">Città del Professionista:</label>
                <input type="text" id="inp-city" placeholder="Es. Ariano nel Polesine (RO)" class="w-full bg-[#151520] border border-zinc-800 rounded-xl p-3 text-sm text-white outline-none focus:border-purple-500 font-bold">
            </div>

            <div id="box-category" class="hidden">
                <label class="block text-[11px] font-bold text-gray-400 mb-1">Settore / Categoria:</label>
                <select id="inp-category" class="w-full bg-[#151520] border border-zinc-800 rounded-xl p-3 text-xs text-white outline-none focus:border-purple-500 font-bold">
                    <option value="psicologo">🧠 Psicologo / Terapeuta</option>
                    <option value="dentista">🦷 Studio Dentistico (Dentis)</option>
                    <option value="legale">⚖️ Studio Legale (Lexis)</option>
                    <option value="hotel">🏨 Hotel / B&B (Concierge24)</option>
                    <option value="consulente">💼 Consulente / Azienda</option>
                </select>
            </div>

            <div id="box-phone">
                <label class="block text-[11px] font-bold text-gray-400 mb-1" id="lbl-phone">Cellulare WhatsApp:</label>
                <input type="tel" id="inp-phone" placeholder="+393401234567" class="w-full bg-[#151520] border border-zinc-800 rounded-xl p-3 text-sm text-white outline-none focus:border-purple-500 font-bold">
            </div>
        </div>

        <button id="m-submit-btn" onclick="generateMobileDemo()" class="w-full bg-gradient-to-r from-purple-600 via-pink-600 to-amber-500 text-white font-black py-4 rounded-2xl text-xs uppercase tracking-wider shadow-xl shadow-purple-600/30 transition active:scale-95 flex items-center justify-center gap-2">
            <i class="fa-solid fa-wand-magic-sparkles text-base"></i> GENERA DEMO IN TEMPO REALE
        </button>

        <div id="m-result-box" class="hidden bg-[#0c140c] border-2 border-emerald-500/50 p-4 rounded-2xl space-y-3">
            <div class="flex items-center gap-2 text-emerald-400 font-black text-xs">
                <i class="fa-solid fa-circle-check animate-bounce text-sm"></i> DEMO PRONTA ALL'USO!
            </div>
            
            <a id="m-wa-link" href="#" target="_blank" class="w-full bg-emerald-600 text-white font-black py-3.5 rounded-xl text-xs uppercase tracking-wider text-center block transition shadow-lg shadow-emerald-600/30 flex items-center justify-center gap-2">
                <i class="fa-brands fa-whatsapp text-base"></i> Invia Ora su WhatsApp
            </a>

            <a id="m-portal-link" href="#" target="_blank" class="w-full bg-purple-600 text-white font-bold py-3 rounded-xl text-xs uppercase tracking-wider text-center block transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-eye"></i> Apri Anteprima Portale
            </a>
        </div>

    </main>

    <footer class="pt-4 text-center text-[10px] text-gray-600 font-bold">
        RM Studio Mobile Lead Engine © 2026
    </footer>

    <script>
        const SAAS_CONFIG = {
            experience: {
                title: "Dati Smart Experience Page:",
                endpoint: "https://n8n.rmstudio.app/webhook/omnia-taste-generate",
                landing: "https://experience.rmstudio.app",
                desc: "Smart Page Ristoranti",
                showUrl: true, lblUrl: "URL Sito Web Ristorante:",
                showName: true, lblName: "Nome Ristorante / Titolare:",
                showCity: false, showCategory: false,
                showPhone: true, lblPhone: "Telefono WhatsApp Ristorante:"
            },
            ff_edizioni: {
                title: "Dati Jingle & Canzoni FF Edizioni:",
                endpoint: "https://n8n.rmstudio.app/webhook/omnia-quick-generate",
                landing: "https://ff-edizioni.rmstudio.app",
                desc: "Jingle Pubblicitari & Canzoni d'Autore",
                showUrl: true, lblUrl: "Link Social o Sito Attività/Sposi:",
                showName: true, lblName: "Nome Brand / Nome Sposi:",
                showCity: false, showCategory: false,
                showPhone: true, lblPhone: "Telefono Referente:"
            },
            nexus: {
                title: "Dati NexusAI Sales Overlay:",
                endpoint: "https://n8n.rmstudio.app/webhook/chatbot-creator",
                landing: "https://nexus.rmstudio.app",
                desc: "AI Sales Overlay Chatbot",
                showUrl: true, lblUrl: "URL Sito Web del Cliente:",
                showName: true, lblName: "Nome Azienda / Brand:",
                showCity: false, showCategory: false,
                showPhone: true, lblPhone: "Telefono Referente:"
            },
            sitengine: {
                title: "Dati SiteEngine Pro Landing:",
                endpoint: "https://n8n.rmstudio.app/webhook/omnia-quick-generate",
                landing: "https://sitengine.rmstudio.app",
                desc: "Landing Page Professionisti",
                showUrl: true, lblUrl: "Vecchio Sito o Link Social:",
                showName: true, lblName: "Nome e Cognome Professionista:",
                showCity: true, showCategory: true,
                showPhone: true, lblPhone: "Telefono Professionista:"
            },
            vision: {
                title: "Dati Vision UGC Video:",
                endpoint: "https://n8n.rmstudio.app/webhook/vision-creator",
                landing: "https://vision.rmstudio.app",
                desc: "Video Influencer AI per E-Commerce",
                showUrl: true, lblUrl: "Link Prodotto / E-Commerce:",
                showName: true, lblName: "Nome Prodotto / Brand:",
                showCity: false, showCategory: false,
                showPhone: true, lblPhone: "Telefono Referente:"
            },
            hometour: {
                title: "Dati HomeTour / DriveMotion:",
                endpoint: "https://n8n.rmstudio.app/webhook/hometour-creator",
                landing: "https://hometour.rmstudio.app",
                desc: "Video Regia AI Immobili & Auto",
                showUrl: true, lblUrl: "Link Annuncio Immobile o Auto:",
                showName: true, lblName: "Nome Agenzia / Concessionaria:",
                showCity: false, showCategory: false,
                showPhone: true, lblPhone: "Telefono Agente:"
            },
            voice_ai: {
                title: "Dati Test Voice AI (Dentis / Lexis / Concierge):",
                endpoint: "https://n8n.rmstudio.app/webhook/dentis-creator",
                landing: "https://dentis.rmstudio.app",
                desc: "Receptionist Telefonica Vocale H24",
                showUrl: true, lblUrl: "Sito Web Clinica / Studio / Hotel:",
                showName: true, lblName: "Nome Studio / Dottore / Hotel:",
                showCity: false, showCategory: true,
                showPhone: true, lblPhone: "Cellulare del Titolare per Test Chiamata:"
            }
        };

        let currentSaasKey = 'experience';

        // 💡 GUIDA AUTOMATICA AL SETTORE
        function adviseSaasBySector() {
            const sector = document.getElementById('sector-advisor').value;
            const tipEl = document.getElementById('advisor-tip');
            
            if (!sector) {
                tipEl.classList.add('hidden');
                return;
            }

            tipEl.classList.remove('hidden');

            if (sector === 'ristorante') {
                selectSaas('experience');
                tipEl.innerHTML = "👉 <b>Consigliato:</b> Smart Experience Page. 🎵 <i>Leva FF Edizioni:</i> regala un Jingle per le Stories Instagram come bonus di chiusura!";
            } else if (sector === 'hotel') {
                selectSaas('voice_ai');
                tipEl.innerHTML = "👉 <b>Consigliato:</b> Concierge24 Vocale H24 per check-in e turisti multilingua. 🎵 <i>Leva FF Edizioni:</i> Inno d'accoglienza personalizzato.";
            } else if (sector === 'evento') {
                selectSaas('ff_edizioni');
                tipEl.innerHTML = "👉 <b>Consigliato:</b> FF Edizioni Canzone d'Autore Inedita su misura per la storia degli sposi o regalo unico!";
            } else if (sector === 'auto') {
                selectSaas('hometour');
                tipEl.innerHTML = "👉 <b>Consigliato:</b> DriveMotion per video auto con cambio sfondo magico.";
            } else if (sector === 'immobile') {
                selectSaas('hometour');
                tipEl.innerHTML = "👉 <b>Consigliato:</b> HomeTour per trasformare le foto piatte dell'immobile in video cinematici 3D.";
            } else if (sector === 'medico' || sector === 'legale') {
                selectSaas('voice_ai');
                tipEl.innerHTML = "👉 <b>Consigliato:</b> Dentis / Lexis per azzerare le chiamate perse e fissare appuntamenti su Google Calendar.";
            } else if (sector === 'palestra') {
                selectSaas('nexus');
                tipEl.innerHTML = "👉 <b>Consigliato:</b> NexusAI Chatbot. 🎵 <i>Leva FF Edizioni:</i> Inno motivazionale della palestra da mettere nei Reel!";
            } else if (sector === 'ecommerce') {
                selectSaas('vision');
                tipEl.innerHTML = "👉 <b>Consigliato:</b> Vision UGC per creare video TikTok/Reels con la modella virtuale Camila in 24 ore.";
            }
        }

        function selectSaas(key) {
            currentSaasKey = key;
            const cfg = SAAS_CONFIG[key];
            if (!cfg) return;

            document.querySelectorAll('.saas-card').forEach(c => c.classList.remove('selected'));
            const card = document.getElementById(`card-${key}`);
            if (card) card.classList.add('selected');

            document.getElementById('saas-form-title').innerText = cfg.title;
            document.getElementById('saas-desc-label').innerText = cfg.desc;
            document.getElementById('saas-landing-link').href = cfg.landing;

            document.getElementById('box-url').classList.toggle('hidden', !cfg.showUrl);
            if (cfg.lblUrl) document.getElementById('lbl-url').innerText = cfg.lblUrl;

            document.getElementById('box-name').classList.toggle('hidden', !cfg.showName);
            if (cfg.lblName) document.getElementById('lbl-name').innerText = cfg.lblName;

            document.getElementById('box-city').classList.toggle('hidden', !cfg.showCity);
            document.getElementById('box-category').classList.toggle('hidden', !cfg.showCategory);

            document.getElementById('box-phone').classList.toggle('hidden', !cfg.showPhone);
            if (cfg.lblPhone) document.getElementById('lbl-phone').innerText = cfg.lblPhone;
        }

        async function generateMobileDemo() {
            const cfg = SAAS_CONFIG[currentSaasKey];
            const siteUrl = document.getElementById('inp-url').value.trim();
            const name = document.getElementById('inp-name').value.trim();
            const city = document.getElementById('inp-city').value.trim();
            const category = document.getElementById('inp-category').value;
            const phone = document.getElementById('inp-phone').value.trim();

            if (cfg.showUrl && !siteUrl && currentSaasKey !== 'sitengine' && currentSaasKey !== 'ff_edizioni') {
                return alert("Inserisci l'URL per procedere con la generazione.");
            }

            const btn = document.getElementById('m-submit-btn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Generazione ${currentSaasKey.toUpperCase()} in corso (15s)...`;

            try {
                const res = await fetch(cfg.endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        site_url: siteUrl,
                        nome_ristorante: name,
                        nome_cliente: name,
                        citta: city,
                        settore: category,
                        phone: phone,
                        title: cfg.desc
                    })
                });

                const data = await res.json();
                
                if (data.success && data.portal_link) {
                    const resultBox = document.getElementById('m-result-box');
                    const portalBtn = document.getElementById('m-portal-link');
                    const waBtn = document.getElementById('m-wa-link');

                    portalBtn.href = data.portal_link;

                    const textWa = `Ciao ${name || 'Titolare'}! Ho creato per voi un'anteprima interattiva dimostrativa di ${cfg.desc}. Puoi provarla qui: ${data.portal_link}`;
                    const cleanPhone = phone ? phone.replace(/\D/g, '') : '';
                    waBtn.href = cleanPhone ? `https://wa.me/${cleanPhone}?text=${encodeURIComponent(textWa)}` : `https://wa.me/?text=${encodeURIComponent(textWa)}`;

                    resultBox.classList.remove('hidden');
                    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                } else {
                    throw new Error(data.message || "Errore sconosciuto.");
                }
            } catch (err) {
                alert("⚠️ Errore generazione: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }
    </script>
</body>
</html>

            animation: glow-pulse 2s infinite ease-in-out !important;
            border-width: 2px !important;
        }

        .saas-card {
            min-height: 108px;
            transition: all 0.15s ease-in-out;

        .saas-card:active {

            drivemotion: { name: "DriveMotion", url: "https://drivemotion.rmstudio.app", desc: "Video Auto Sfondo AI" },
            hometour: { name: "HomeTour", url: "https://hometour.rmstudio.app", desc: "Reel Immobiliari 3D" },
            vision: { name: "Vision UGC", url: "https://vision.rmstudio.app", desc: "Influencer & Testimonial Virtuali" },
            sitengine: { name: "SiteEngine Pro", url: "https://sitengine.rmstudio.app", desc: "Landing Professionisti" },
            omniastudio: { name: "OmniaStudio", url: "https://omniastudio.rmstudio.app", desc: "IA Offline Privata 100%" },
            free_energy: { name: "Free Energy", url: "https://free-energy.rmstudio.app", desc: "CAD Fotovoltaico & CRM B2B" },
            velomotion: { name: "VeloMotion", url: "https://velomotion.rmstudio.app", desc: "Sblocco Bosch BES3 Sicuro" },
            ff_edizioni: { name: "FF Edizioni", url: "https://ff-edizioni.rmstudio.app", desc: "Musica Custom & Jingle SIAE" }
        };

        let currentActiveSaas = "aura";

        function selectSaas(key) {
            currentActiveSaas = key;
            const item = SAAS_CATALOG[key];
            if (!item) return;

            document.querySelectorAll('.saas-card').forEach(c => c.classList.remove('selected'));
            const selectedCard = document.getElementById(`card-${key}`);
            if (selectedCard) selectedCard.classList.add('selected');

            document.getElementById('bar-saas-title').innerText = item.name;
            document.getElementById('bar-saas-url').innerText = item.url;
            document.getElementById('bar-open-btn').href = item.url;
        }

        function copyCurrentSaasUrl() {
            const url = SAAS_CATALOG[currentActiveSaas]?.url || "https://rmstudio.app";
            navigator.clipboard.writeText(url).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.remove('hidden');
                setTimeout(() => toast.classList.add('hidden'), 2000);
            });
        }

        function highlightSuggestedSaas() {
            const sector = document.getElementById('sector-advisor').value;
            document.querySelectorAll('.saas-card').forEach(c => c.classList.remove('glow-suggested'));

            if (!sector) return;

            const map = {
                architettura: ['card-forma_materia', 'card-sitengine', 'card-social'],
                prossimita: ['card-aura', 'card-ares', 'card-drivemotion'],
                sicurezza_cantieri: ['card-aura', 'card-free_energy', 'card-forma_materia'],
                vigilanza: ['card-aura', 'card-omniastudio', 'card-nexus'],
                funebre: ['card-eternia', 'card-ff_edizioni', 'card-nexus'],
                ristorante: ['card-locanda', 'card-experience', 'card-ff_edizioni'],
                hotel: ['card-concierge', 'card-aura', 'card-social'],
                auto: ['card-drivemotion', 'card-aura', 'card-nexus'],
                immobile: ['card-hometour', 'card-forma_materia', 'card-sitengine'],
                medico: ['card-dentis', 'card-nexus', 'card-sitengine'],
                legale: ['card-lexis', 'card-omniastudio', 'card-sitengine'],
                palestra: ['card-ares', 'card-aura', 'card-vision'],
                ecommerce: ['card-vision', 'card-nexus', 'card-ff_edizioni'],
                evento: ['card-love', 'card-aura', 'card-ff_edizioni'],
                azienda: ['card-sitengine', 'card-nexus', 'card-omniastudio']
            };

            const targets = map[sector] || ['card-aura', 'card-forma_materia'];
            targets.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.add('glow-suggested');
            });

            const firstKey = targets[0]?.replace('card-', '');
            if (firstKey) selectSaas(firstKey);
        }

        document.addEventListener('DOMContentLoaded', () => {
            selectSaas('aura');
        });
    </script>
</body>
</html>

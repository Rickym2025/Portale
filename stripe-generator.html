<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generatore Link Stripe On-The-Fly — RM Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050508; color: #f3f4f6; }
        .font-display { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col justify-between selection:bg-purple-600 selection:text-white">

    <div class="max-w-3xl w-full mx-auto space-y-6">
        <!-- HEADER -->
        <div class="flex justify-between items-center pb-4 border-b border-zinc-900">
            <div class="flex items-center gap-3">

                </div>
                <div>
                    <h1 class="text-lg font-black text-white">Stripe Checkout Generator</h1>

                </div>
            </div>
            <a href="index.html" class="px-4 py-2 rounded-xl bg-zinc-900 hover:bg-zinc-800 text-xs font-bold border border-zinc-800">
                ← Torna al Command Center

        <!-- FORM CREAZIONE ON-THE-FLY -->
        <form id="stripe-form" onsubmit="generateStripeLink(event)" class="p-6 rounded-3xl bg-[#0b0b0f] border border-zinc-900 space-y-5 shadow-2xl">
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- SELEZIONE SAAS (24 OPZIONI) -->
                <div>
                    <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1.5">1. Progetto SaaS *</label>
                    <select id="sel-progetto" onchange="autoFillPresets()" class="w-full bg-[#15151e] border border-zinc-800 rounded-xl p-3 text-sm text-white font-bold outline-none focus:border-purple-500">
                        <option value="SuperProf" selected>🎓 SuperProf (Docenti &amp; Didattica)</option>
                        <option value="Nexus">🤖 NexusAI (Sales Overlay)</option>
                        <option value="Elena">🍽️ Elena AI (Hostess Ristoranti H24)</option>
                        <option value="Vittoria">🚀 Vittoria AI (Centralino Agenzie B2B)</option>
                        <option value="Locanda">🍕 Locanda Digitale (Living Menu 3D &amp; Marketing)</option>
                        <option value="Experience">🍷 Experience (Smart Menu &amp; Maître AI)</option>
                        <option value="Dentis">🦷 Dentis AI (Voice Receptionist)</option>
                        <option value="Lexis">⚖️ Lexis AI (Voice Receptionist)</option>
                        <option value="RADAR">🏎️ DriveMotion RADAR (Sourcing Privati)</option>
                        <option value="Forma & Materia">🏛️ Forma &amp; Materia (Rendering Neurale)</option>
                        <option value="AURA">📡 AURA Proximity (Virtual Mesh Radar)</option>
                        <option value="ETERNIA">🕊️ ETERNIA (Onoranze Funebri &amp; Pet)</option>
                        <option value="LOVE">💍 LOVE (Partecipazioni Digitali)</option>
                        <option value="Concierge24">🏨 Concierge24 (Voice AI Hotel)</option>
                        <option value="Free Energy">☀️ Free Energy (CRM Fotovoltaico)</option>
                        <option value="SiteEngine">🌐 SiteEngine Pro (Landing &amp; Siti)</option>
                        <option value="VeloMotion">⚡ VeloMotion (Sblocco E-Bike)</option>
                        <option value="Vision">🎬 Vision UGC (Video AI)</option>
                        <option value="HomeTour">🏠 HomeTour (Video Immobili)</option>
                        <option value="DriveMotion">🚗 DriveMotion (Video Auto)</option>
                        <option value="Ares">🏋️ AresAI (Fitness &amp; Dieta)</option>
                        <option value="Social">📊 Carousel Engine (Social Creator)</option>
                        <option value="FF">🎵 FF Edizioni (Musica &amp; Inni SIAE)</option>
                        <option value="OmniaStudio">💼 OmniaStudio (IA Offline)</option>
                    </select>
                </div>

                <!-- PRESET RAPIDI O PREZZO LIBERO -->
                <div>
                    <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1.5">2. Pacchetto Predefinito</label>
                    <select id="sel-preset" onchange="applyPreset()" class="w-full bg-[#15151e] border border-zinc-800 rounded-xl p-3 text-sm text-white font-semibold outline-none focus:border-purple-500">
                        <!-- Popolato dinamicamente via JS -->
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <!-- TITOLO SCONTRINO / RICEVUTA -->
                <div class="sm:col-span-2">
                    <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1.5">Titolo Prodotto (Visibile su Ricevuta Stripe) *</label>
                    <input type="text" id="inp-title" required value="SuperProf - Anno Scolastico Pro (1.000 Crediti)" class="w-full bg-[#15151e] border border-zinc-800 rounded-xl p-3 text-sm text-white font-bold outline-none focus:border-purple-500">
                </div>

                <!-- IMPORTO EURO -->
                <div>
                    <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1.5">Prezzo (€) *</label>
                    <input type="number" step="0.01" id="inp-price" required value="49.00" class="w-full bg-[#15151e] border border-zinc-800 rounded-xl p-3 text-base text-amber-400 font-extrabold outline-none focus:border-purple-500 font-mono">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- EMAIL CLIENTE -->
                <div>
                    <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1.5">Email Cliente / Lead / Docente</label>
                    <input type="email" id="inp-email" placeholder="cliente@azienda.it" class="w-full bg-[#15151e] border border-zinc-800 rounded-xl p-3 text-sm text-white outline-none focus:border-purple-500 font-mono">
                </div>

                <!-- ID PROGETTO / SLUG -->
                <div>
                    <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1.5">ID Progetto / Slug Attività</label>
                    <input type="text" id="inp-agency" placeholder="es. prof-rossi / agenzia-damare" class="w-full bg-[#15151e] border border-zinc-800 rounded-xl p-3 text-sm text-white outline-none focus:border-purple-500 font-mono">
                </div>
            </div>

            <!-- TASTO GENERAZIONE -->
            <button type="submit" id="btn-submit" class="w-full py-4 rounded-2xl bg-gradient-to-r from-amber-500 via-orange-500 to-amber-500 hover:opacity-90 text-black font-black text-sm uppercase tracking-wider shadow-lg transition-all active:scale-[0.98]">
                ⚡ Genera Link Checkout Stripe Immediato
            </button>
        </form>

        <!-- RISULTATO LINK GENERATO -->
        <div id="result-box" class="hidden p-6 rounded-3xl bg-[#0c140c] border-2 border-emerald-500/50 space-y-4">
            <div class="flex items-center gap-2 text-emerald-400 font-black text-sm">
                <i class="fa-solid fa-circle-check text-lg"></i> LINK STRIPE PRONTO!
            </div>

            <div class="p-3 bg-black/60 rounded-xl border border-emerald-500/30 font-mono text-xs text-emerald-300 break-all select-all" id="txt-stripe-url">
                https://checkout.stripe.com/...
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <button type="button" onclick="copyLink()" class="py-3 px-4 rounded-xl bg-zinc-900 hover:bg-zinc-800 text-white border border-zinc-700 text-xs font-bold flex items-center justify-center gap-2">
                    <i class="fa-solid fa-copy"></i> Copia Link
                </button>
                <a id="btn-wa" href="#" target="_blank" class="py-3 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold flex items-center justify-center gap-2 text-center">
                    <i class="fa-brands fa-whatsapp text-base"></i> Invia su WhatsApp
                </a>
            </div>
        </div>
    </div>

    <footer class="py-6 text-center text-xs text-gray-500 font-mono">
        © 2026 RM Studio • Stripe Dynamic Engine
    </footer>

    <script>
        const PRESETS = {

            ],

                { val: "169|Locanda Digitale - Gourmet 12 (Living 3D Menu)|visual", label: "Gourmet 12 Living 3D Menu (€169)" },
                { val: "290|Locanda Digitale - Grand Carta & Suite Marketing|allin", label: "Grand Carta & Suite Marketing (€290)" }
            ],

                { val: "190|Smart Experience - Starter|starter", label: "Starter (€190)" },
                { val: "350|Smart Experience - Signature Page|pro", label: "Signature Page (€350)" },
                { val: "600|Smart Experience - Royal SIAE|royal", label: "Royal SIAE (€600)" }
            ],
            Dentis: [
                { val: "79|Dentis AI - Serena Starter|starter", label: "Serena Starter (€79/m)" },
                { val: "149|Dentis AI - Serena PRO|pro", label: "Serena PRO (€149/m)" },
                { val: "299|Dentis AI - Clinic Elite|elite", label: "Clinic Elite (€299/m)" }
            ],
            Lexis: [
                { val: "79|Lexis AI - Chiara Starter|starter", label: "Chiara Starter (€79/m)" },
                { val: "149|Lexis AI - Chiara PRO|pro", label: "Chiara PRO (€149/m)" },
                { val: "299|Lexis AI - Studio Elite|elite", label: "Studio Elite (€299/m)" }
            ],
            RADAR: [
                { val: "99|DriveMotion RADAR - Starter Salone (1 Prov.)|starter", label: "Starter Salone 1 Prov. (€99/m)" },
                { val: "179|DriveMotion RADAR - PRO Regionale (5 Prov.)|pro", label: "PRO Regionale 5 Prov. (€179/m)" },
                { val: "349|DriveMotion RADAR - Enterprise Nazionale (107 Prov.)|enterprise", label: "Enterprise 107 Prov. (€349/m)" }
            ],
            "Forma & Materia": [
                { val: "99|Forma & Materia - Progetto Singolo (6 Render)|starter", label: "Progetto Singolo 6 Render (€99)" },
                { val: "249|Forma & Materia - Atelier Pro (20 Render 4K)|pro", label: "Atelier Pro 20 Render 4K (€249)" },
                { val: "590|Forma & Materia - Grand Studio (60 Render 4K)|studio", label: "Grand Studio 60 Render 4K (€590)" }
            ],
            AURA: [
                { val: "4.90|AURA - Pass Viaggio Singolo (24h)|pass_viaggio", label: "Pass Viaggio Singolo (€4.90)" },
                { val: "19|AURA - Pro Mensile Illimitato|pro_monthly", label: "Aura Pro Mensile (€19/m)" },
                { val: "79|AURA - Studio & Gym Hub B2B|studio_hub", label: "Studio & Gym Hub (€79/m)" }
            ],
            ETERNIA: [
                { val: "79|ETERNIA - Credit Starter (1 Cerimonia)|starter", label: "Credit Starter (€79)" },
                { val: "199|ETERNIA - Servizio VIP «Chiavi in Mano»|vip", label: "VIP Chiavi in Mano (€199)" },
                { val: "690|ETERNIA - Agency Hub B2B (10 Cerimonie)|hub", label: "Agency Hub 10 Cerimonie (€690)" },
                { val: "300|ETERNIA - Brano Musicale d'Autore (Echi)|echi", label: "Brano d'Autore Echi (€300)" }
            ],
            LOVE: [
                { val: "149|LOVE - Sposi Self-Service (1 Anno)|self", label: "Sposi Self-Service (€149)" },
                { val: "249|LOVE - Sposi Chiavi in Mano|vip", label: "Sposi VIP (€249)" },
                { val: "490|LOVE - Agency Hub B2B (10 Matrimoni)|hub", label: "Agency Hub 10 Matrimoni (€490)" }
            ],
            Concierge24: [
                { val: "149|Concierge24 - Setup Chiavi in Mano|setup", label: "Setup Chiavi in Mano (€149)" },
                { val: "49|Concierge24 - Ricarica Base (100 min)|base", label: "Ricarica Base (€49)" },
                { val: "179|Concierge24 - Ricarica Pro (450 min)|pro", label: "Ricarica Pro (€179)" },
                { val: "349|Concierge24 - Ricarica Max (1000 min)|max", label: "Ricarica Max (€349)" }
            ],
            "Free Energy": [
                { val: "199|Free Energy - Start Pack (10.000 Crediti)|base", label: "Start Pack 10k (€199)" },
                { val: "449|Free Energy - Pro Pack (25.000 Crediti)|max", label: "Pro Pack 25k (€449)" }
            ],
            SiteEngine: [
                { val: "400|SiteEngine Pro - Sblocco Sito d'Autore|unlock", label: "Sblocco Sito Completo (€400)" },
                { val: "200|SiteEngine Pro - Rinnovo Annuale & Hosting|renewal", label: "Rinnovo Annuale (€200/anno)" }
            ],
            VeloMotion: [
                { val: "290|VeloMotion - Sblocco Software (32 km/h)|software", label: "Sblocco Software 32 km/h (€290)" },
                { val: "320|VeloMotion - Sblocco Hardware (45 km/h)|hardware", label: "Sblocco Hardware 45 km/h (€320)" }
            ],
            Vision: [
                { val: "50|Vision UGC - Starter Pack (1 Video)|starter", label: "Starter Pack 1 Video (€50)" },
                { val: "120|Vision UGC - Pro Bundle (3 Video)|pro", label: "Pro Bundle 3 Video (€120)" },
                { val: "340|Vision UGC - Agency Maxi Pack (10 Video)|maxi", label: "Agency Maxi Pack (€340)" }
            ],
            HomeTour: [
                { val: "14.90|HomeTour AI - Starter Pack (2 Video)|starter", label: "Starter Pack 2 Video (€14.90)" },
                { val: "59|HomeTour AI - Pro Pack (10 Video)|pro", label: "Pro Pack 10 Video (€59)" },
                { val: "129|HomeTour AI - Maxi Pack (25 Video)|max", label: "Maxi Pack 25 Video (€129)" }
            ],
            DriveMotion: [
                { val: "14.90|DriveMotion - Starter Pack (1 Video HD)|starter", label: "Starter Pack 1 Video (€14.90)" },
                { val: "59|DriveMotion - Pro Pack (5 Video Credits)|pro", label: "Pro Pack 5 Video Credits (€59)" },
                { val: "129|DriveMotion - Maxi Pack (15 Video Credits)|max", label: "Maxi Pack 15 Video Credits (€129)" }
            ],
            Ares: [
                { val: "19|AresAI - Atleta PRO (Mensile)|base", label: "Atleta PRO (€19/m)" },
                { val: "99|AresAI - Coach Hub B2B (30 Atleti)|coach", label: "Coach Hub B2B (€99/m)" },
                { val: "199|AresAI - Gym Arena Maxischermo|elite", label: "Gym Arena Maxischermo (€199/m)" }
            ],
            Social: [
                { val: "29|Carousel Engine - Starter Pack|starter", label: "Starter Pack (€29)" },
                { val: "79|Carousel Engine - Pro Pack|pro", label: "Pro Pack (€79)" },
                { val: "199|Carousel Engine - Agency Unlimited|agency", label: "Agency Unlimited (€199)" }
            ],
            FF: [
                { val: "300|FF Edizioni - Inno / Brano d'Autore SIAE|custom", label: "Inno / Brano Inedito SIAE (€300)" },
                { val: "250|FF Edizioni - Jingle Commerciale Radio/Social|jingle", label: "Jingle Commerciale Radio/Social (€250)" }
            ],
            OmniaStudio: [
                { val: "699|OmniaStudio PRO - Licenza Lifetime Offline|lifetime", label: "Licenza Lifetime Offline (€699)" }
            ]
        };

        function autoFillPresets() {
            const prog = document.getElementById('sel-progetto').value;
            const selPreset = document.getElementById('sel-preset');
            const list = PRESETS[prog] || [
                { val: "49|Piano Starter|starter", label: "Starter (€49)" },
                { val: "99|Piano Pro|pro", label: "PRO (€99)" },
                { val: "199|Piano Elite|elite", label: "Elite (€199)" }
            ];

            selPreset.innerHTML = list.map(p => `<option value="${p.val}">${p.label}</option>`).join('') + `<option value="custom">-- Importo Personalizzato --</option>`;
            applyPreset();
        }

        function applyPreset() {
            const val = document.getElementById('sel-preset').value;
            if (val === 'custom') return;
            const [price, title] = val.split('|');
            document.getElementById('inp-price').value = price;
            document.getElementById('inp-title').value = title;
        }

        async function generateStripeLink(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            const orig = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Generazione Stripe Session...`;

            const prog = document.getElementById('sel-progetto').value;
            const title = document.getElementById('inp-title').value;
            const price = parseFloat(document.getElementById('inp-price').value);
            const email = document.getElementById('inp-email').value.trim();
            const agency = document.getElementById('inp-agency').value.trim();
            const presetVal = document.getElementById('sel-preset').value;
            const ricarica_tipo = presetVal.includes('|') ? presetVal.split('|')[2] : 'custom';

            let originUrl = "https://portale.rmstudio.app";
            let portalType = "html";

            if (prog === 'SuperProf') {
                originUrl = 'https://superprof.rmstudio.app';
                portalType = 'superprof';
            }
            else if (prog === 'Nexus') {
                originUrl = 'https://nexus.rmstudio.app';
                portalType = 'nexus';
            }
            else if (prog === 'Elena') { 
                originUrl = 'https://dentis-app.rmstudio.app'; 
                portalType = 'elena'; 
            }
            else if (prog === 'Vittoria') { 
                originUrl = 'https://dentis-app.rmstudio.app'; 
                portalType = 'vittoria'; 
            }
            else if (prog === 'Dentis') { 
                originUrl = 'https://dentis.rmstudio.app'; 
                portalType = 'dentis'; 
            }
            else if (prog === 'Lexis') { 
                originUrl = 'https://lexis.rmstudio.app'; 
                portalType = 'lexis'; 
            }
            else if (prog === 'RADAR') { 
                originUrl = 'https://drivemotion-radar.rmstudio.app'; 
                portalType = 'radar'; 
            }
            else if (prog === 'Locanda') { 
                originUrl = 'https://locandadigitale.rmstudio.app'; 
                portalType = 'locanda'; 
            }
            else if (prog === 'Experience') { 
                originUrl = 'https://experience.rmstudio.app'; 
                portalType = 'experience'; 
            }
            else if (prog === 'AURA') { 
                originUrl = 'https://aura.rmstudio.app'; 
                portalType = 'aura'; 
            }
            else if (prog === 'Forma & Materia') { 
                originUrl = 'https://formamateria.rmstudio.app'; 
                portalType = 'forma_materia'; 
            }
            else if (prog === 'ETERNIA') {
                originUrl = 'https://eternia.rmstudio.app';
                portalType = 'eternia';
            }
            else if (prog === 'LOVE') {
                originUrl = 'https://love.rmstudio.app';
                portalType = 'love';
            }
            else if (prog === 'Concierge24') {
                originUrl = 'https://concierge24.rmstudio.app';
                portalType = 'concierge';
            }
            else if (prog === 'Free Energy') {
                originUrl = 'https://free-energy.rmstudio.app';
                portalType = 'free_energy';
            }
            else if (prog === 'SiteEngine') {
                originUrl = 'https://sitengine.rmstudio.app';
                portalType = 'siteengine';
            }
            else if (prog === 'VeloMotion') {
                originUrl = 'https://velomotion.rmstudio.app';
                portalType = 'velomotion';
            }
            else if (prog === 'Vision') {
                originUrl = 'https://vision.rmstudio.app';
                portalType = 'vision';
            }
            else if (prog === 'HomeTour') {
                originUrl = 'https://hometour.rmstudio.app';
                portalType = 'hometour';
            }
            else if (prog === 'DriveMotion') {
                originUrl = 'https://drivemotion.rmstudio.app';
                portalType = 'drivemotion';
            }
            else if (prog === 'Ares') {
                originUrl = 'https://ares.rmstudio.app';
                portalType = 'ares';
            }
            else if (prog === 'Social') {
                originUrl = 'https://social.rmstudio.app';
                portalType = 'social';
            }
            else if (prog === 'FF') {
                originUrl = 'https://ff.rmstudio.app';
                portalType = 'ff';
            }
            else if (prog === 'OmniaStudio') {
                originUrl = 'https://omniastudio.rmstudio.app';
                portalType = 'omniastudio';
            }
            else { 
                originUrl = `https://${prog.toLowerCase().replace(/\s+/g, '')}.rmstudio.app`; 
                portalType = prog.toLowerCase().replace(/\s+/g, '_'); 
            }

            try {
                const res = await fetch("https://n8n.rmstudio.app/webhook/crea-sessione-stripe", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        email: email,
                        price: price,
                        title: title,
                        project_id: agency || "direct-checkout",
                        portal_type: portalType,
                        origin: originUrl,
                        ricarica_tipo: ricarica_tipo
                    })
                });

                const data = await res.json();
                if (data?.url) {
                    document.getElementById('txt-stripe-url').innerText = data.url;
                    document.getElementById('result-box').classList.remove('hidden');

                    const textWa = `Salve! Ecco il link sicuro di Stripe per l'attivazione di ${title} (€${price.toFixed(2)}):\n${data.url}`;
                    document.getElementById('btn-wa').href = `https://wa.me/?text=${encodeURIComponent(textWa)}`;
                    
                    document.getElementById('result-box').scrollIntoView({ behavior: 'smooth' });
                } else {
                    throw new Error("Impossibile generare l'URL di pagamento da Stripe.");
                }
            } catch (err) {
                alert("⚠️ Errore: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = orig;
            }
        }

        function copyLink() {
            const url = document.getElementById('txt-stripe-url').innerText;
            navigator.clipboard.writeText(url);
            alert("✓ Link Stripe copiato negli appunti!");
        }

        document.addEventListener("DOMContentLoaded", () => {
            autoFillPresets();
        });
    </script>
</body>
</html>
